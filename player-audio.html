<style>:root{--bg:#EEF2FF;--fg:#14162B;--muted:#4F5575;--accent:#FFD23F;--accent-soft:#FFF0B3;--line:#D3D9F2;--bar:#FFFFFF;--head:#14162B;--field:#FFFFFF;--warn:#B3261E;--ink:#14162B;--shadow:#14162B;--on:#14162B;--accent-text:#1F5FB8;--ui:#0B7A58;--ui-soft:#DDF5EC;--ui-on:#FFFFFF;--font-read:"Albert Sans",system-ui,sans-serif;--font-ui:"Albert Sans",system-ui,sans-serif;--font-display:"Fredoka","Albert Sans",system-ui,sans-serif;}@media (prefers-color-scheme:dark){:root{--bg:#101226;--fg:#F2F3FF;--muted:#A9AED6;--accent:#FFD23F;--accent-soft:#4A3F14;--line:#2A2F55;--bar:#1B1E3A;--head:#F2F3FF;--field:#1B1E3A;--warn:#FF8A7D;--ink:#7A80C4;--shadow:#04050E;--on:#14162B;--accent-text:#8DB8FF;--ui:#34D3A1;--ui-soft:#12352B;--ui-on:#0B0D1E;color-scheme:dark}}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);padding-inline:20px}[hidden]{display:none!important}

.rr input{flex:1;min-width:0}

.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.rnote{line-height:1.45}
.dp{position:fixed;left:12px;right:12px;bottom:170px;max-width:34rem;margin:0 auto;height:min(44vh,28rem);z-index:8;display:flex;flex-direction:column;background:var(--bar);color:var(--fg);border:2.5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden;font-family:var(--font-ui)}

@media(prefers-reduced-motion:no-preference){.dpb.star{transition:transform .12s}.dpb.star:active{transform:scale(.92)}}
.dpb:focus-visible,.dtab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dpbody{flex:1;min-height:0;overflow:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:12px}
.dpid{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:.92rem;line-height:1.5;color:var(--fg)}

.dtabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--line);flex:none}

.dn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--muted);font:600 .75rem var(--font-ui);display:grid;place-items:center;margin-top:3px}
.dsb{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.dtx{font-size:1rem;line-height:1.5}
.den{font-size:.82rem;color:var(--muted);line-height:1.4}
.dex{border-left:3px solid var(--accent);padding-left:10px;font-style:italic;color:var(--muted);font-size:.92rem;line-height:1.45}
.dmsg{color:var(--muted);font-size:.92rem;line-height:1.5}
.dfoot{flex:none;border-top:1px solid var(--line);padding:8px 14px;font-size:.8rem;color:var(--muted)}
.dfoot a{color:var(--accent-text)}
.dsel{width:100%;flex:none;font:600 .9rem var(--font-ui);padding:9px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--bar);color:var(--head)}
.rd{--font-ipa:"Gentium Plus","Charis SIL","Noto Serif",serif}
.rtb{border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);border-radius:999px;background:var(--bar);color:var(--head);font-family:var(--font-display)}

.rtitle{font-family:var(--font-display);font-weight:600}

.rtm,.gh span{color:var(--accent-text)}

/* ---- latihan ---- */
.rd{--ok:#0B7A58;--ok-bg:#CFF3E2;--bad:#B3261E;--bad-bg:#FBD9D5}
@media (prefers-color-scheme:dark){.rd{--ok:#34D3A1;--ok-bg:#12352B;--bad:#FF8A7D;--bad-bg:#4A1D19}}
:root[data-theme="dark"] .rd{--ok:#34D3A1;--ok-bg:#12352B;--bad:#FF8A7D;--bad-bg:#4A1D19}
:root[data-theme="light"] .rd{--ok:#0B7A58;--ok-bg:#CFF3E2;--bad:#B3261E;--bad-bg:#FBD9D5}
.pbar{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:16px;background:var(--bar)}
.pbar[hidden]{display:none}
.pbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pt{font:600 .9rem var(--font-display);color:var(--head)}
.ps{font:600 .8rem var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.pbb{display:flex;flex-wrap:wrap;gap:6px}
.pbb .chip{padding:6px 11px}
.chip.pmain{background:var(--ui);border-color:var(--ink);color:var(--ui-on)}
.pleg{display:flex;flex-wrap:wrap;gap:6px 12px;font:600 .75rem var(--font-ui)}
.pleg[hidden]{display:none}
.lg.ok{color:var(--ok)}.lg.bad,.lg.miss{color:var(--bad)}
.rd.prac .w{cursor:default}
.rd.prac .w.f .t{color:var(--fg)}
.rd.prac .w.on{background:none;box-shadow:none}
.rd.prac .w.on .t{color:inherit;font-weight:inherit;text-decoration:none}
.rd.prac .w:hover{background:none}
.rd.prac .w.pdim{opacity:.38}
.rd.prac .w[role=button]{cursor:pointer}
.rd.prac .w[role=button]:hover{background:var(--accent-soft)}
.rd.prac .w:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rd.prac .w.pk{background:var(--accent);box-shadow:0 0 0 2px var(--ink)}
.rd.prac .w.pk .t{color:var(--on)}
.rd.prac .w.ok{background:var(--ok-bg);box-shadow:0 0 0 2px var(--ok)}
.rd.prac .w.ok .t{color:var(--ok);font-weight:700}
.rd.prac .w.ok .t::after{content:" ✓";font-size:.7em}
.rd.prac .w.bad{background:var(--bad-bg);box-shadow:0 0 0 2px var(--bad)}
.rd.prac .w.bad .t{color:var(--bad);font-weight:700;text-decoration:line-through}
.rd.prac .w.bad .t::after{content:" ✗";font-size:.7em;text-decoration:none;display:inline-block}
.rd.prac .w.miss{outline:2px dashed var(--bad);outline-offset:1px}
.rd.prac .w.miss .t{color:var(--bad);font-weight:700}
.rd.prac .w.rev{box-shadow:0 0 0 2px var(--accent-text)}
.rd.prac .ph{display:none!important}
.rd.prac .w.ok,.rd.prac .w.bad,.rd.prac .w.miss,.rd.prac .w.rev{white-space:nowrap}
.pa{font:700 .72em var(--font-ui);color:var(--ok);margin-left:.3em;white-space:nowrap}
.pa::before{content:"→ "}
.pa.hint{color:var(--accent-text)}
.w.miss .pa,.w.bad .pa{color:var(--ok)}
.pin{font:inherit;color:var(--fg);background:var(--field);border:2px solid var(--ink);border-radius:8px;padding:0 .25em;margin:0 .1em;min-width:7.5ch;max-width:100%;height:1.5em;vertical-align:baseline;text-align:center}
.pin:focus{outline:3px solid var(--accent);outline-offset:1px}
.pin.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.pin.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700}

.dqbar{flex:1;height:14px;border-radius:7px;background:var(--line);border:2.5px solid var(--ink);overflow:hidden}
.dqbar i{display:block;height:100%;width:0;background:var(--ui);transition:width .3s}
.dqn{flex:none;min-width:3.2em;text-align:right;font:700 .85rem var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.dqm{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;width:100%;max-width:var(--col);margin:0 auto;padding:8px 20px;display:flex;flex-direction:column;justify-content:center}
.dqq{display:flex;flex-direction:column;align-items:center;gap:22px}
.dqq[hidden],.dqres[hidden]{display:none}
.dqtag{font:600 .85rem/1.4 var(--font-ui);color:var(--accent-text);background:var(--accent-soft);padding:8px 14px;border-radius:12px;text-align:center}
.dqplay{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--accent);color:var(--on);display:grid;place-items:center;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.dqplay svg{width:26px;height:26px}
.dqs{margin:0;text-align:center;font:700 calc(var(--fs)*1.1px)/1.9 var(--font-read);color:var(--head);text-wrap:balance}
.dqk{display:inline-block;min-width:5.2em;min-height:1.55em;line-height:1.3;padding:.05em .4em;margin:0 .15em;vertical-align:middle;border:2.5px dashed var(--ink);border-radius:10px;background:var(--field);color:var(--fg);font:inherit;cursor:pointer}
.dqk.filled{border-style:solid}
.dqk.hov{background:var(--accent-soft);border-style:solid}
.dqk.ok{border:2.5px solid var(--ok);background:var(--ok-bg);color:var(--ok)}
.dqk.bad{border:2.5px solid var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.dqch{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:3.6em}
.dqc{touch-action:none;user-select:none;-webkit-user-select:none;font:700 1.1rem var(--font-ui);padding:10px 16px;border:2.5px solid var(--ink);border-radius:12px;background:var(--bar);color:var(--fg);box-shadow:3px 3px 0 var(--shadow);cursor:grab}
.dqc.used,.dqc.lift{opacity:.3;box-shadow:none}
.dqc:disabled{cursor:default}
.dqc.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:30;cursor:grabbing;opacity:1;box-shadow:5px 5px 0 var(--shadow)}
.dqf{width:100%;max-width:var(--col);margin:0 auto;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.dqfb{border:2.5px solid;border-radius:14px;padding:10px 14px;font-size:.95rem;line-height:1.45}
.dqfb[hidden]{display:none}
.dqfb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dqfb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.dqfb small{display:block;margin-top:4px;font-size:.85rem;color:var(--fg)}
.dqok{font:700 1.05rem var(--font-ui);border:2.5px solid var(--ink);border-radius:14px;padding:14px;background:var(--ui);color:var(--ui-on);box-shadow:3px 3px 0 var(--shadow);cursor:pointer}

.dqres h2{margin:0 0 8px;font:700 1.6rem var(--font-display);color:var(--head);text-align:center}
.dqrt{margin:0 0 10px;color:var(--muted);text-align:center;font-weight:600}
.dqres ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dqres li{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bar);font-size:.95rem;line-height:1.45}
.dqres li small{display:block;margin-top:4px;color:var(--muted)}
.dqk.act{border-style:solid;box-shadow:0 0 0 3px var(--accent)}
.dqk{min-width:4.2em}
.dqfb{max-height:36vh;overflow:auto}
.dqfb ul{margin:6px 0 0;padding-left:0;list-style:none;font-size:.85rem;line-height:1.45;color:var(--fg)}
.dqfb li{margin-top:3px}
.dqs{font-size:calc(var(--fs)*1px)}
.dqfb{max-height:none;overflow:visible;padding:0}
.dqfh{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:10px 14px;font:inherit;color:inherit;cursor:pointer;text-align:left}

.dqfc{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;transition:transform .25s}
.dqfc svg{width:20px;height:20px}
.dqfb.min .dqfc{transform:rotate(180deg)}
.dqfbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.dqfbody>div{min-height:0;overflow:hidden}
.dqfb.min .dqfbody{grid-template-rows:0fr}
.dqfbody ul{max-height:30vh;overflow:auto;margin:0;padding:0 14px 10px}

      const cv=document.createElement('span');cv.className='dqfc';cv.setAttribute('aria-hidden','true');cv.innerHTML='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>';
      hb.append(h,cv);fb.appendChild(hb);
      const bd=document.createElement('div');bd.className='dqfbody';const inn=document.createElement('div');
      const ul=document.createElement('ul');
      q.blanks.forEach((b,j)=>{const li=document.createElement('li');li.textContent=(j+1)+'. '+(res[j]?'✓ ':'✗ ')+b.correct+': '+b.rule;ul.appendChild(li)});
      inn.appendChild(ul);bd.appendChild(inn);fb.appendChild(bd);
      hb.addEventListener('click',()=>{const m=fb.classList.toggle('min');hb.setAttribute('aria-expanded',String(!m));hb.setAttribute('aria-label',m?'Buka koreksi':'Ciutkan koreksi')});
      $$('.dqc').forEach(x=>{x.disabled=true});
      Q.phase='next';$q('.dqok').disabled=false;$q('.dqok').textContent=Q.n+1>=Q.list.length?'Lihat hasil':'Lanjut';
      return;
    }
    Q.n++;if(Q.n>=Q.list.length)showResult();else showQ();
  }
  function sentText(q){
    const m={};q.blanks.forEach(b=>{m[b.i]=b.correct});const out=[];
    for(let kk=q.ka;kk<=q.kz;kk++){const g=SEG[kk];for(let i=g.a;i<=g.z;i++){if(m[i]===undefined)out.push(WORDS[i].w);else{const p=splitP(WORDS[i].w);out.push(p.a+m[i]+p.z)}}}
    return out.join(' ');
  }
  function showResult(){
    Q.phase='result';au.pause();
    $q('.dqbar i').style.width='100%';$q('.dqn').textContent='';
    $q('.dqq').hidden=true;const r=$q('.dqres');r.hidden=false;r.textContent='';
    $q('.dqfb').hidden=true;
    const h=document.createElement('h2');h.textContent='Skor '+Q.score+' dari '+Q.total+' kotak';r.appendChild(h);
    const t=document.createElement('p');t.className='dqrt';
    if(Q.wrong.length){
      t.textContent='Yang perlu diulang:';r.appendChild(t);
      const ul=document.createElement('ul');
      Q.wrong.slice(0,8).forEach(w=>{const li=document.createElement('li');const a=document.createElement('div');a.textContent=sentText(w.q);li.appendChild(a);
        w.bad.forEach(j=>{const b=document.createElement('small');b.textContent=w.q.blanks[j].correct+': '+w.q.blanks[j].rule;li.appendChild(b)});ul.appendChild(li)});
      r.appendChild(ul);
    }else{t.textContent='Semua benar. Mantap!';r.appendChild(t)}
    $q('.dqok').textContent='Soal baru';$q('.dqok').disabled=false;
  }
  /* seret atau ketuk kata dari bank ke kotak */
  (function(){
    const ch=$q('.dqch'),dq=$q('.dq');
    const nearest=ev=>{let best=-1,bd=1e9;$$('.dqk').forEach(b=>{const r=b.getBoundingClientRect(),m=28,dx=Math.max(r.left-ev.clientX,0,ev.clientX-r.right),dy=Math.max(r.top-ev.clientY,0,ev.clientY-r.bottom);if(dx<=m&&dy<=m){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best=+b.dataset.b}}});return best};
    ch.addEventListener('pointerdown',e=>{
      const btn=e.target.closest('.dqc');if(!btn||btn.disabled||!Q||Q.phase!=='ask'||(e.button&&e.button>0))return;
      const id=+btn.dataset.id,sx=e.clientX,sy=e.clientY;let ghost=null,moved=false,hv=-1;
      const mark=j=>{hv=j;$$('.dqk').forEach(b=>b.classList.toggle('hov',+b.dataset.b===j))};
      const mv=ev=>{
        if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;ghost=btn.cloneNode(true);ghost.classList.add('ghost');dq.appendChild(ghost);btn.classList.add('lift')}
        if(moved){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';mark(nearest(ev))}
      };
      const end=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',cx);
        if(ghost)ghost.remove();btn.classList.remove('lift');mark(-1)};
      const up=ev=>{const j=moved?nearest(ev):-1;end();if(!moved)chipTap(id);else if(j>=0)place(id,j)};
      const cx=()=>end();
      addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',cx);
    });
    ch.addEventListener('click',e=>{const btn=e.target.closest('.dqc');if(btn&&e.detail===0)chipTap(+btn.dataset.id)});
  })();
  applyPref();paintAll(-1);
  if(cfg.startAt){au.addEventListener('loadedmetadata',()=>{au.currentTime=cfg.startAt},{once:true})}
  ui();
  return{
    getTime:()=>au.currentTime,
    pause:()=>{cancelGap();au.pause()},
    destroy:()=>{cancelGap();au.pause();cancelAnimationFrame(raf);removeEventListener('scroll',onScroll);removeEventListener('keydown',onKey);root.innerHTML=''}
  };
}


/* Akhir transkrip.
   - Dibuka dari path.html  -> tombol "Selesai ✓" (tandai selesai, kembali ke path.html)
   - Dibuka dari tempat lain -> tombol "Lanjut berikutnya" (urutan index.json) + "Review kosakata" (kosakata.html)
   Panel baru muncul saat waktu putar mencapai akhir transkrip. mount(bar) menaruh panel di halaman.
   Mengembalikan fungsi check(t, awalBarisTerakhir, akhirTranskrip, sudahSelesai). */
function lessonEnd(slug,mount,self){
  if(!slug)return function(){};
  var from=null,rvDone=false;
  try{
    if(new URLSearchParams(location.search).get('from')==='path')from='path.html'; // ?from=path dari path.html
    else{ // cadangan untuk tautan lama tanpa from: deteksi lewat referrer
      var r=document.referrer?new URL(document.referrer):null;
      if(r&&r.origin===location.origin&&/\/path(\.html)?$/.test(r.pathname))from=r.pathname+r.search;
    }
  }catch(e){}
  var css=document.createElement('style');
  css.textContent='#endBar{display:flex;flex-direction:column;gap:12px;width:calc(100% - 32px);max-width:var(--col,34rem);margin:24px auto 0;flex:none}#endBar[hidden],#endBar .eb[hidden]{display:none}#endBar .eb{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border:2.5px solid var(--ink,#14162B);border-radius:999px;background:var(--surface,var(--bar,#fff));color:var(--ink,var(--fg,#14162B));font:600 1.05rem var(--font-display,var(--font-ui,system-ui));box-shadow:3px 3px 0 var(--shadow,#14162B);cursor:pointer;text-decoration:none;text-align:center}#endBar .eb.pri{background:var(--accent,#FFD23F);color:var(--on,var(--accent-ink,#14162B))}#endBar .eb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow,#14162B)}';
  document.head.appendChild(css);
  var bar=document.createElement('div');bar.id='endBar';bar.hidden=true;
  if(from){
    var d=document.createElement('button');d.type='button';d.className='eb pri';d.textContent='Selesai ✓';
    d.addEventListener('click',function(){
      try{
        var p=JSON.parse(localStorage.getItem('lf:path'))||{};
        if(!p.done||typeof p.done!=='object')p.done={};
        p.done[slug]={at:Date.now()};
        localStorage.setItem('lf:path',JSON.stringify(p));
        localStorage.setItem('lf:path:pending','null'); // jangan tanya lagi di path
      }catch(e){}
      location.href=from;
    });
    bar.appendChild(d);
  }else{
    // setelah review kosakata, kosakata.html mengembalikan ke sini dengan &rv=1: tombol Lanjut jadi utama
    rvDone=/[?&]rv=1(&|$)/.test(location.search);
    var here=(location.pathname.split('/').pop()||'')+location.search.replace(/([?&])rv=1(&|$)/,'$1').replace(/[?&]$/,'');
    var nx=document.createElement('a');nx.className='eb'+(rvDone?' pri':'');nx.hidden=true;nx.textContent='Lanjut berikutnya →';
    var rv=document.createElement('a');rv.className='eb'+(rvDone?'':' pri');rv.href='kosakata.html?from='+encodeURIComponent(here);rv.textContent=rvDone?'Review kosakata lagi':'Review kosakata';
    if(rvDone){bar.appendChild(nx);bar.appendChild(rv)}else{bar.appendChild(rv);bar.appendChild(nx)}
    var note=document.createElement('p');note.hidden=true;note.style.cssText='margin:0;text-align:center;font:500 .9rem var(--font-ui,system-ui);color:var(--muted,#4F5575)';
    bar.insertBefore(note,bar.firstChild);
    var U=['index.json','data/index.json','/index.json','/data/index.json','../index.json','../data/index.json'],norm=function(s){return String(s||'').replace(/\.json$/i,'').toLowerCase()};
    (function go(k){
      if(k>=U.length){note.textContent='Daftar pelajaran (index.json) tidak ditemukan.';note.hidden=false;return}
      fetch(U[k],{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
        var L=Array.isArray(j)?j:(j&&j.lessons);if(!Array.isArray(L))throw 0;
        var i=-1,s=norm(slug);
        for(var a=0;a<L.length;a++)if(norm(L[a].slug)===s){i=a;break}
        if(i<0){note.textContent='Pelajaran ini belum terdaftar di index.json, jadi pelajaran berikutnya tidak diketahui.';note.hidden=false;return}
        var n=L[i+1],prev=false;
        if(!n){ // pelajaran terakhir: tombol diganti jadi kembali ke pelajaran sebelumnya
          n=i>0?L[i-1]:null;prev=true;
          if(!n){note.textContent='Ini satu-satunya pelajaran di daftar.';note.hidden=false;return}
        }
        var want=n.videoId?'video':'audio',file=decodeURIComponent(location.pathname.split('/').pop()||''),pg;
        if(want===self&&file)pg=file; // pakai nama file halaman ini apa adanya, mis. "player-video (4).html"
        else if(file&&new RegExp(self,'i').test(file))pg=file.replace(new RegExp(self,'i'),want);
        else pg='player-'+want+'.html';
        nx.href=encodeURI(pg)+'?q='+encodeURIComponent(n.slug);
        nx.textContent=prev?'← Pelajaran sebelumnya':'Lanjut berikutnya →';
        nx.hidden=false;
      }).catch(function(){go(k+1)});
    })(0);
  }
  mount(bar);
  var latched=false;
  if(rvDone){bar.hidden=false;setTimeout(function(){try{bar.scrollIntoView({block:'nearest'})}catch(e){}},500);return function(){}} // baru kembali dari review: panel langsung tampil
  return function(t,lastStart,endT,ended){
    var was=latched;
    if(ended||t>=endT-0.05)latched=true;
    else if(t<lastStart-0.1)latched=false; // diputar ulang dari tengah: sembunyikan lagi
    bar.hidden=!latched;
    if(latched&&!was)setTimeout(function(){try{bar.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}},400);
  };
}

(async()=>{
  const app=document.getElementById("app"),q=new URLSearchParams(location.search);
  const fail=m=>{app.innerHTML='<div class="ld"><p></p><a href="/index.html">Kembali</a></div>';app.querySelector("p").textContent=m};
  const pv=q.get("preview"),G=pv?window.parent:null;
  let f=q.get("q")||q.get("f")||location.hash.slice(1);
  f=(f||"").replace(/\.json$/i,"").replace(/[^\w.-]+/g,"-");
  if(!f&&!pv)return fail("Alamat tidak lengkap. Tambahkan ?q=namafile");
  try{
    let j;
    if(pv){ // preview dari generator: JSON disimpan sementara di sessionStorage
      const pj=sessionStorage.getItem("lf:preview-audio");if(!pj)throw new Error("preview kosong");
      j=JSON.parse(pj);f=j.slug||"preview";
    }else{
      const r=await fetch("data/"+f+".json");if(!r.ok)throw new Error(r.status);
      j=await r.json();
    }
    document.title=j.title||document.title;
    const T=(j.transcript||j.words||[]).map(a=>({w:a[0],s:a[1],e:a[2],b:a[3],h:a[4],p:a[5],tr:a[6]||''}));
    if(!T.length||!j.audio)throw new Error("kosong");
    let endCheck=null;
    const cfg={words:T,audio:j.audio,key:pv?"preview":(j.slug||f),title:j.title||"",hasPh:T.some(x=>x.p),hasTr:T.some(x=>x.tr),
      onTime:(t,ls,le,en)=>{if(endCheck)endCheck(t,ls,le,en)}};
    let exEl=null;
    if(pv){
      // mode preview: tombol Kembali ke form + menu Ekspor milik generator
      exEl=G.document.getElementById("exp");
      cfg.back=null;cfg.onBack=true;cfg.info=j.info||"";cfg.phNote=j.phNote||"";
      if(exEl){cfg.exportEl=exEl;
        let css="";[].forEach.call(G.document.styleSheets,function(sh){try{[].forEach.call(sh.cssRules,function(r){if(r.selectorText&&r.selectorText.indexOf("#exp")===0)css+=r.cssText+"\n"})}catch(e){}});
        const st=document.createElement("style");st.textContent=css;document.head.appendChild(st);}
    }
    createReader(app,cfg);
    if(pv){const bb=app.querySelector(".rback-btn");if(bb)bb.onclick=function(){G.closePreview()}}
    try{
      if(!pv)endCheck=lessonEnd(q.get("q")||f,bar=>{
        const rd=app.querySelector(".rd");if(!rd)return;
        const put=()=>{const a=rd.querySelector(".rtxt");if(a&&a.nextElementSibling!==bar)a.after(bar)};
        put();
        new MutationObserver(put).observe(rd,{childList:true}); // dipasang lagi jika reader dirender ulang
      },'audio');
    }catch(e){}
  }catch(e){fail(pv?'Data preview tidak ditemukan. Kembali ke generator lalu buat sinkronisasi lagi.':'Data "'+f+'" tidak bisa dimuat.')}
})();</script>
