<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Berita | Learning Fun</title>
<meta name="description" content="Berita terbaru dari Google News dalam bahasa Indonesia dan English.">
<meta name="theme-color" content="#EEF2FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101226" media="(prefers-color-scheme: dark)">
<script>try{var t=JSON.parse(localStorage.getItem('lf:theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&family=Gentium+Plus:ital,wght@0,400;1,400&display=swap">
<style>
:root {
  --bg: #EEF2FF;
  --surface: #FFFFFF;
  --ink: #14162B;
  --on: #14162B;            /* teks di atas warna cerah: selalu gelap */
  --muted: #4F5575;
  --line: #14162B;
  --shadow: #14162B;
  --rule: #D3D9F2;
  --ipa: #1F5FB8;
  --yellow: #FFD23F;
  --coral: #FF6B5E;
  --blue: #4C84FF;
  --mint: #2ED3A0;
  --purple: #A07CFA;
  --font: 'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Fredoka', 'Albert Sans', system-ui, sans-serif;
  --font-ipa: 'Gentium Plus', 'Charis SIL', 'Noto Serif', 'DejaVu Serif', serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101226; --surface: #1B1E3A; --ink: #F2F3FF; --muted: #A9AED6; --line: #7A80C4; --shadow: #04050E;
    --rule: #2A2F55; --ipa: #8DB8FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101226; --surface: #1B1E3A; --ink: #F2F3FF; --muted: #A9AED6; --line: #7A80C4; --shadow: #04050E;
  --rule: #2A2F55; --ipa: #8DB8FF; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 16px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

.wrap { width: min(1120px, 100% - 2 * clamp(16px, 4vw, 40px)); margin-inline: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -56px; padding: 8px 14px; border-radius: 10px; background: var(--yellow); color: var(--on); border: 2.5px solid var(--line); font-weight: 700; z-index: 20; }
.skip:focus { top: 12px; }

/* Warna per kategori */
.c-yellow { --c: var(--yellow); }
.c-coral  { --c: var(--coral); }
.c-blue   { --c: var(--blue); }
.c-mint   { --c: var(--mint); }
.c-purple { --c: var(--purple); }

/* Tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border: 2.5px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink);
  font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.2;
  text-decoration: none; cursor: pointer; box-shadow: 4px 4px 0 var(--shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--shadow); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
.btn-primary { background: var(--yellow); color: var(--on); }
.btn-small { padding: 8px 18px; font-size: 0.95rem; box-shadow: 3px 3px 0 var(--shadow); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; text-decoration: none; }
.logo { display: grid; place-items: center; width: 40px; height: 40px; border: 2.5px solid var(--line); border-radius: 12px; background: var(--yellow); box-shadow: 3px 3px 0 var(--shadow); }
.right { display: flex; align-items: center; gap: 8px; }
.nav { display: flex; gap: 4px; }
.nav a { padding: 8px 14px; border-radius: 999px; font-weight: 600; text-decoration: none; }
.nav a:hover { background: var(--surface); }
.icon-btn { display: grid; place-items: center; width: 42px; height: 42px; border: 2.5px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); }
.icon-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }

/* Hero */
.hero { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: clamp(32px, 6vw, 72px); align-items: center; padding-block: clamp(24px, 5vw, 64px) clamp(48px, 7vw, 96px); }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.4rem, 6.2vw, 4.4rem); line-height: 1.06; letter-spacing: -0.01em; text-wrap: balance; }
.lede { max-width: 46ch; margin-top: 20px; font-size: 1.2rem; color: var(--muted); text-wrap: pretty; }
.cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }

.demo {
  position: relative; padding: 32px 28px 24px; background: var(--surface);
  border: 2.5px solid var(--line); border-radius: 26px; box-shadow: 8px 8px 0 var(--shadow);
  transform: rotate(1.2deg);
}
.sticker { position: absolute; top: -18px; right: 22px; padding: 4px 14px; border: 2.5px solid var(--line); border-radius: 10px; background: var(--coral); color: var(--on); font-family: var(--font-display); font-weight: 700; transform: rotate(4deg); }
.demo-cap { color: var(--muted); font-size: 0.95rem; font-weight: 600; }
.demo-line { display: flex; flex-wrap: wrap; gap: 10px 2px; margin-top: 14px; }
.dw {
  display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 7px 5px; border: 2px solid transparent; border-radius: 12px; background: transparent; cursor: pointer;
  font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 3vw, 1.75rem); line-height: 1.1;
  transition: background-color 0.18s ease;
}
.dw:hover { border-color: var(--line); }
.dw .p { font-family: var(--font-ipa); font-weight: 400; font-size: 0.95rem; line-height: 1.2; color: var(--ipa); }
.dw.on { background: var(--yellow); border-color: var(--line); color: var(--on); }
.dw.on .p { color: var(--on); }
.demo-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 2px dashed var(--rule); }
.demo-hint { color: var(--muted); font-size: 0.95rem; }

.blob { position: absolute; z-index: -1; border: 2.5px solid var(--line); }
.b1 { right: -14px; top: -6px; width: 84px; height: 84px; border-radius: 50%; background: var(--yellow); }
.b2 { right: 8%; bottom: 10px; width: 110px; height: 110px; border-radius: 50%; background: var(--mint); }
.b3 { left: 47%; top: 8%; width: 44px; height: 44px; border-radius: 12px; background: var(--purple); transform: rotate(18deg); }

/* Cara belajar */
.how { padding-bottom: clamp(56px, 8vw, 96px); }
.how h2, .browse-head h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.5rem); line-height: 1.1; }
.how-lede { max-width: 58ch; margin-top: 10px; color: var(--muted); }
.steps { list-style: none; margin: 36px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.step { padding: 24px 22px 26px; background: var(--surface); border: 2.5px solid var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--shadow); }
.ico { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 16px; border: 2.5px solid var(--line); border-radius: 50%; background: var(--c); color: var(--on); }
.step h3 { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; line-height: 1.2; }
.step .n { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 2px solid var(--line); border-radius: 50%; background: var(--c); color: var(--on); font-size: 1rem; }
.step p { margin-top: 8px; color: var(--muted); max-width: 34ch; }

/* Daftar latihan */
.browse { padding-bottom: clamp(56px, 8vw, 96px); }
.browse-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.progress { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ptext { font-weight: 600; }
.pbar { width: 180px; height: 16px; border: 2.5px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.pfill { display: block; height: 100%; width: 0; background: var(--mint); border-right: 2.5px solid var(--line); transition: width 0.4s ease; }
.pfill[style*="width: 0%"] { border-right: 0; }

.tools { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
.selects { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.sel { position: relative; display: block; }
.sel::after { content: ""; position: absolute; right: 20px; top: 50%; width: 8px; height: 8px; border-right: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.sel select { width: 100%; appearance: none; -webkit-appearance: none; padding: 11px 44px 11px 18px; border: 2.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: 600 1rem var(--font); box-shadow: 3px 3px 0 var(--shadow); cursor: pointer; text-overflow: ellipsis; }
.sel option { background: var(--surface); color: var(--ink); }
.sel.on { color: var(--on); }
.sel.on select { background: var(--yellow); color: var(--on); }
.sel.on option { color: var(--ink); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
  border: 2.5px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink);
  font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; cursor: pointer; box-shadow: 3px 3px 0 var(--shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.chip .dot { width: 12px; height: 12px; border: 2px solid var(--line); border-radius: 50%; background: var(--c); }
.chip .n { font-family: var(--font); font-weight: 700; font-size: 0.9rem; color: var(--muted); }
.chip:hover { transform: translate(-1px, -1px); }
.chip[aria-pressed="true"] { background: var(--c); color: var(--on); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.chip[aria-pressed="true"] .n { color: var(--on); }
.chip[aria-pressed="true"] .dot { background: var(--surface); }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 15px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: 11px 16px 11px 44px; border: 2.5px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: 3px 3px 0 var(--shadow); }
.search input::placeholder { color: var(--muted); }
.tagrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 18px; }
.tagrow-label { font-weight: 700; color: var(--muted); }
.tagchips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.tagchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px;
  border: 2px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink);
  font-weight: 600; font-size: 0.92rem; cursor: pointer;
}
.tagchip .n { color: var(--muted); font-weight: 500; }
.tagchip:hover { background: var(--surface); }
.tagchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tagchip[aria-pressed="true"] .n { color: inherit; opacity: 0.75; }
.hint { min-height: 1.5em; margin-top: 14px; color: var(--muted); }
.status { margin: 6px 0 0; color: var(--muted); font-size: 0.95rem; font-weight: 600; }

.grid { list-style: none; margin: 24px 0 0; padding: 0 8px 8px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 32px; }
.grid > li { display: flex; }
.card {
  display: flex; flex-direction: column; width: 100%;
  background: var(--surface); color: var(--ink); text-decoration: none;
  border: 2.5px solid var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--shadow); overflow: hidden;
  transition: transform 0.14s ease, box-shadow 0.14s ease;
}
.card:hover, .card:focus-visible { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--shadow); }
.card:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--shadow); }
.media { position: relative; display: block; aspect-ratio: 16 / 9; background: var(--c); border-bottom: 2.5px solid var(--line); overflow: hidden; }
.media img { display: block; width: 100%; height: 100%; object-fit: cover; }
.media .big { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-ipa); font-size: clamp(3.8rem, 9vw, 5.2rem); line-height: 1; color: var(--on); }
.play { position: absolute; left: 12px; bottom: 12px; display: grid; place-items: center; width: 46px; height: 46px; border: 2.5px solid var(--line); border-radius: 50%; background: var(--yellow); color: var(--on); }
.info { display: flex; flex: 1; flex-direction: column; gap: 8px; padding: 18px 18px 20px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { padding: 1px 10px; border: 2px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--c) 30%, var(--surface)); font-size: 0.82rem; font-weight: 700; }
.pill.new { background: var(--yellow); color: var(--on); }
.pill.seen { background: color-mix(in srgb, var(--mint) 38%, var(--surface)); }
.card .t { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; line-height: 1.2; }
.card .desc { margin-bottom: 10px; color: var(--muted); font-size: 0.97rem; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 10px; }
.tag { padding: 0 10px; border: 2px solid var(--rule); border-radius: 999px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }
.go { align-self: flex-start; margin-top: auto; padding: 8px 20px; border: 2.5px solid var(--line); border-radius: 999px; background: var(--c); color: var(--on); font-family: var(--font-display); font-weight: 600; }

/* Kartu audio: ikon podcast + judul di kiri, cover bulat di kanan */
.card.audio { flex-direction: row; align-items: stretch; gap: 14px; padding: 16px 16px 16px 18px; }
.card.audio .info { padding: 0; gap: 10px; min-width: 0; justify-content: space-between; }
.card.audio .mic { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border: 2.5px solid var(--line); border-radius: 50%; background: var(--c); color: var(--on); }
.card.audio .dur { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card.audio .t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card.audio .cover { position: relative; flex: none; align-self: center; width: clamp(92px, 30%, 128px); aspect-ratio: 1; border: 2.5px solid var(--line); border-radius: 50%; background: var(--c); overflow: hidden; display: grid; place-items: center; }
.card.audio .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card.audio .cover .big { font-family: var(--font-ipa); font-size: 2.4rem; line-height: 1; color: var(--on); }

.sk .media { background: var(--rule); }
.sk .bar-a, .sk .bar-b { display: block; height: 14px; border-radius: 7px; background: var(--rule); }
.sk .bar-a { width: 55%; height: 20px; }
.sk .bar-b { width: 85%; }
.sk .card { pointer-events: none; }
.sk .media, .sk .bar-a, .sk .bar-b { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }

.empty { grid-column: 1 / -1; padding: 32px; border: 2.5px dashed var(--line); border-radius: 22px; background: var(--surface); }
.empty p { margin-bottom: 14px; font-weight: 600; }

.foot { padding-block: 8px 56px; color: var(--muted); font-size: 0.95rem; }

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .demo { transform: none; }
  .b3 { display: none; }
  .steps { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .nav { display: none; }
  .grid { gap: 28px; }
  .b2 { right: 4px; bottom: 0; width: 80px; height: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Tag: slider ke samping */
.tagrow { flex-wrap: nowrap; gap: 12px; }
.tagrow-label { flex: none; }
.tagchips { flex: 1; min-width: 0; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 4px 36px 4px 2px; cursor: grab;
  -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
.tagchips::-webkit-scrollbar { display: none; }
.tagchips.drag { cursor: grabbing; user-select: none; }
.tagchips li { flex: none; }
.tagchip { white-space: nowrap; }
.tags { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.tags::-webkit-scrollbar { display: none; }
.tag { flex: none; white-space: nowrap; }

/* Langganan channel */
.views { gap: 10px; }
.chip .n { margin-left: 2px; }
.fol { display: inline-block; max-width: 100%; padding: 1px 10px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 0.82rem; font-weight: 700; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.fol i { font-style: normal; margin-right: 5px; }
.fol:hover { background: color-mix(in srgb, var(--mint) 30%, var(--surface)); }
.fol[aria-pressed="true"] { background: var(--mint); color: var(--on); }
.fol:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sel.dim select { color: var(--muted); }

/* Halaman berita */
.news-head { padding-block: 28px 8px; }
.news-head h1 { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
.news-head p { margin-top: 8px; color: var(--muted); }
.news-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; margin-top: 18px; align-items: center; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding: 4px 8px 10px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-top: 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll li { flex: none; }
.chip { white-space: nowrap; }
.news-status { min-height: 1.5em; margin-top: 14px; color: var(--muted); font-weight: 600; }
.card .src { display: inline-block; padding: 1px 10px; border: 2px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--c) 30%, var(--surface)); font-size: 0.82rem; font-weight: 700; align-self: flex-start; }
.card .when { color: var(--muted); font-size: 0.9rem; font-weight: 600; }
.card .t { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.news-grid { margin-top: 20px; }
.nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 3px; }
@media (max-width: 640px) { .nav { display: none; } .news-tools { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="wrap top">
  <a class="brand" href="index.html">
    <span class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="#fff" stroke="#14162B" stroke-width="2" stroke-linejoin="round"/></svg>
    </span>
    Learning Fun
  </a>
  <div class="right">
    <nav class="nav" aria-label="Menu utama">
      <a href="index.html">Latihan</a>
      <a href="berita.html" aria-current="page">Berita</a>
    </nav>
    <button id="theme" class="icon-btn" type="button" aria-label="Ganti tema terang atau gelap">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="wrap news-head">
    <h1>Berita</h1>
    <p>Baca berita terbaru dari Google News. Pilih edisi English untuk latihan membaca.</p>
    <div class="news-tools">
      <label class="search">
        <span class="sr">Cari berita</span>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="Cari berita, lalu tekan Enter" autocomplete="off">
      </label>
      <div class="sel" id="edwrap">
        <label class="sr" for="ed">Edisi berita</label>
        <select id="ed">
          <option value="id">Bahasa Indonesia</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <ul class="chips scroll" id="cats" aria-label="Kategori berita"></ul>
    <p class="news-status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="wrap" aria-label="Daftar berita">
    <ul class="grid news-grid" id="list"></ul>
  </section>
</main>

<footer class="wrap foot">Sumber: Google News. Artikel dibuka di situs penerbitnya.</footer>

<script>
(() => {
  'use strict';
  const CATS = [
    ['Terbaru', null, 'blue'], ['Indonesia', 'NATION', 'coral'], ['Dunia', 'WORLD', 'mint'],
    ['Bisnis', 'BUSINESS', 'yellow'], ['Teknologi', 'TECHNOLOGY', 'purple'], ['Olahraga', 'SPORTS', 'blue'],
    ['Hiburan', 'ENTERTAINMENT', 'coral'], ['Sains', 'SCIENCE', 'mint'], ['Kesehatan', 'HEALTH', 'yellow']
  ];
  const EDITIONS = { id: 'hl=id&gl=ID&ceid=ID:id', en: 'hl=en-US&gl=US&ceid=US:en' };
  const $ = id => document.getElementById(id);
  const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const state = { cat: 0, q: '', ed: 'id', run: 0 };

  try { const e = JSON.parse(localStorage.getItem('lf:newsEd')); if (e === 'id' || e === 'en') state.ed = e; } catch (e) {}
  $('ed').value = state.ed;

  /* ---------- URL feed ---------- */
  function feedUrl() {
    const ed = EDITIONS[state.ed];
    if (state.q) return 'https://news.google.com/rss/search?q=' + encodeURIComponent(state.q) + '&' + ed;
    const t = CATS[state.cat][1];
    return t ? 'https://news.google.com/rss/headlines/section/topic/' + t + '?' + ed : 'https://news.google.com/rss?' + ed;
  }

  /* ---------- Pengambilan data ----------
     Di aplikasi (APK), fetch langsung berjalan lewat jalur native sehingga tidak kena CORS.
     Di browser, dipakai perantara publik sebagai cadangan. */
  async function getText(url, ms) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 12000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.text();
    } finally { clearTimeout(t); }
  }
  function parseXml(text) {
    const d = new DOMParser().parseFromString(text, 'text/xml');
    if (d.querySelector('parsererror')) throw new Error('XML tidak valid');
    return [...d.querySelectorAll('item')].map(i => {
      const g = n => { const el = i.querySelector(n); return el ? el.textContent : ''; };
      let title = g('title').trim();
      const source = g('source').trim();
      if (source && title.endsWith(' - ' + source)) title = title.slice(0, -(source.length + 3));
      return { title, source, link: g('link').trim(), time: Date.parse(g('pubDate')) || 0 };
    }).filter(a => a.title && a.link);
  }
  async function viaRss2Json(url) {
    const j = JSON.parse(await getText('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(url)));
    if (j.status !== 'ok' || !Array.isArray(j.items)) throw new Error('rss2json gagal');
    return j.items.map(it => {
      let title = (it.title || '').trim(), source = '';
      const k = title.lastIndexOf(' - ');
      if (k > 0) { source = title.slice(k + 3); title = title.slice(0, k); }
      const time = Date.parse(String(it.pubDate || '').replace(' ', 'T') + 'Z') || 0;
      return { title, source, link: it.link || '', time };
    }).filter(a => a.title && a.link);
  }
  async function fetchNews(url) {
    const tries = [
      async () => parseXml(await getText(url)),
      () => viaRss2Json(url),
      async () => parseXml(await getText('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)))
    ];
    let last;
    for (const t of tries) {
      try { const r = await t(); if (r.length) return r; last = new Error('Kosong'); }
      catch (e) { last = e; }
    }
    throw last || new Error('Gagal');
  }

  /* ---------- Tampilan ---------- */
  function ago(ms) {
    if (!ms) return '';
    const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    const en = state.ed === 'en';
    if (m < 1) return en ? 'just now' : 'baru saja';
    if (m < 60) return en ? m + ' min ago' : m + ' menit lalu';
    const h = Math.round(m / 60);
    if (h < 24) return en ? h + ' hr ago' : h + ' jam lalu';
    const d = Math.round(h / 24);
    return en ? d + ' d ago' : d + ' hari lalu';
  }
  function openLink(url) {
    const B = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Browser;
    if (B && B.open) { B.open({ url }); return true; }
    return false;
  }
  function render(items) {
    const ul = $('list');
    ul.textContent = '';
    const colors = ['blue', 'coral', 'mint', 'yellow', 'purple'];
    items.forEach((a, i) => {
      const li = document.createElement('li');
      const card = document.createElement('a');
      card.className = 'card';
      card.href = a.link; card.target = '_blank'; card.rel = 'noopener noreferrer';
      card.style.setProperty('--c', 'var(--' + colors[i % colors.length] + ')');
      card.addEventListener('click', ev => { if (openLink(a.link)) ev.preventDefault(); });
      const info = document.createElement('span'); info.className = 'info';
      if (a.source) { const s = document.createElement('span'); s.className = 'src'; s.textContent = a.source; info.appendChild(s); }
      const t = document.createElement('span'); t.className = 't'; t.textContent = a.title; info.appendChild(t);
      const w = document.createElement('span'); w.className = 'when'; w.textContent = ago(a.time); info.appendChild(w);
      const go = document.createElement('span'); go.className = 'go'; go.textContent = state.ed === 'en' ? 'Read' : 'Baca'; info.appendChild(go);
      card.appendChild(info); li.appendChild(card); ul.appendChild(li);
    });
  }
  function renderCats() {
    const ul = $('cats'); ul.textContent = '';
    CATS.forEach((c, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.style.setProperty('--c', 'var(--' + c[2] + ')');
      b.setAttribute('aria-pressed', String(!state.q && i === state.cat));
      const d = document.createElement('span'); d.className = 'dot'; d.setAttribute('aria-hidden', 'true');
      b.appendChild(d); b.appendChild(document.createTextNode(c[0]));
      b.addEventListener('click', () => { state.cat = i; state.q = ''; $('q').value = ''; renderCats(); load(); });
      li.appendChild(b); ul.appendChild(li);
    });
  }
  async function load() {
    const my = ++state.run;
    $('status').textContent = 'Memuat berita...';
    try {
      const items = await fetchNews(feedUrl());
      if (my !== state.run) return;
      render(items);
      $('status').textContent = items.length + ' berita' + (state.q ? ' untuk "' + state.q + '"' : '');
    } catch (e) {
      if (my !== state.run) return;
      $('list').textContent = '';
      const li = document.createElement('li'); li.className = 'empty';
      const p = document.createElement('p'); p.textContent = 'Berita belum bisa dimuat. Periksa koneksi internet, lalu coba lagi.';
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = 'Coba lagi';
      b.addEventListener('click', load);
      li.appendChild(p); li.appendChild(b); $('list').appendChild(li);
      $('status').textContent = '';
    }
  }

  $('q').addEventListener('keydown', e => {
    if (e.key === 'Enter') { state.q = e.target.value.trim(); renderCats(); load(); e.target.blur(); }
  });
  $('ed').addEventListener('change', e => {
    state.ed = e.target.value;
    try { localStorage.setItem('lf:newsEd', JSON.stringify(state.ed)); } catch (x) {}
    load();
  });
  $('theme').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const n = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    try { localStorage.setItem('lf:theme', JSON.stringify(n)); } catch (x) {}
  });

  renderCats();
  load();
})();
</script>
</body>
</html>
