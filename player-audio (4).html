<style>:root{--bg:#EEF2FF;--fg:#14162B;--muted:#4F5575;--accent:#FFD23F;--accent-soft:#FFF0B3;--line:#D3D9F2;--bar:#FFFFFF;--head:#14162B;--field:#FFFFFF;--warn:#B3261E;--ink:#14162B;--shadow:#14162B;--on:#14162B;--accent-text:#1F5FB8;--ui:#0B7A58;--ui-soft:#DDF5EC;--ui-on:#FFFFFF;--font-read:"Albert Sans",system-ui,sans-serif;--font-ui:"Albert Sans",system-ui,sans-serif;--font-display:"Fredoka","Albert Sans",system-ui,sans-serif;}@media (prefers-color-scheme:dark){:root{--bg:#101226;--fg:#F2F3FF;--muted:#A9AED6;--accent:#FFD23F;--accent-soft:#4A3F14;--line:#2A2F55;--bar:#1B1E3A;--head:#F2F3FF;--field:#1B1E3A;--warn:#FF8A7D;--ink:#7A80C4;--shadow:#04050E;--on:#14162B;--accent-text:#8DB8FF;--ui:#34D3A1;--ui-soft:#12352B;--ui-on:#0B0D1E;color-scheme:dark}}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);padding-inline:20px}[hidden]{display:none!important}

.rr{display:flex;align-items:center;gap:10px}
.rr input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.rnote{line-height:1.45}
.dp{position:fixed;left:12px;right:12px;bottom:170px;max-width:34rem;margin:0 auto;height:min(44vh,28rem);z-index:8;display:flex;flex-direction:column;background:var(--bar);color:var(--fg);border:2.5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);overflow:hidden;font-family:var(--font-ui)}

.ttsb{max-width:var(--col);margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:600 .8rem var(--font-ui);color:var(--muted)}.ttsb select{font:inherit;color:var(--fg);background:var(--field);border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;max-width:100%}.ttsb .ts-n{flex-basis:100%;font-weight:500;color:var(--warn)}
@media(prefers-reduced-motion:no-preference){.dpb.star{transition:transform .12s}.dpb.star:active{transform:scale(.92)}}

.dpbody{flex:1;min-height:0;overflow:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:12px}

.dtabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--line);flex:none}

.dsb{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.dtx{font-size:1rem;line-height:1.5}
.den{font-size:.82rem;color:var(--muted);line-height:1.4}
.dex{border-left:3px solid var(--accent);padding-left:10px;font-style:italic;color:var(--muted);font-size:.92rem;line-height:1.45}
.dmsg{color:var(--muted);font-size:.92rem;line-height:1.5}
.dfoot{flex:none;border-top:1px solid var(--line);padding:8px 14px;font-size:.8rem;color:var(--muted)}
.dfoot a{color:var(--accent-text)}
.dsel{width:100%;flex:none;font:600 .9rem var(--font-ui);padding:9px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--bar);color:var(--head)}
.rd{--font-ipa:"Gentium Plus","Charis SIL","Noto Serif",serif}
.rtb{border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--shadow);border-radius:999px;background:var(--bar);color:var(--head);font-family:var(--font-display)}
.rtb[aria-expanded=true]{background:var(--accent);color:var(--on)}
.rtitle{font-family:var(--font-display);font-weight:600}

.w.on{background:var(--accent);box-shadow:0 0 0 2px var(--ink)}

/* ---- latihan ---- */
.rd{--ok:#0B7A58;--ok-bg:#CFF3E2;--bad:#B3261E;--bad-bg:#FBD9D5}
@media (prefers-color-scheme:dark){.rd{--ok:#34D3A1;--ok-bg:#12352B;--bad:#FF8A7D;--bad-bg:#4A1D19}}
:root[data-theme="dark"] .rd{--ok:#34D3A1;--ok-bg:#12352B;--bad:#FF8A7D;--bad-bg:#4A1D19}
:root[data-theme="light"] .rd{--ok:#0B7A58;--ok-bg:#CFF3E2;--bad:#B3261E;--bad-bg:#FBD9D5}
.pbar{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:16px;background:var(--bar)}
.pbar[hidden]{display:none}
.pbh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pt{font:600 .9rem var(--font-display);color:var(--head)}
.ps{font:600 .8rem var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.pbb{display:flex;flex-wrap:wrap;gap:6px}
.pbb .chip{padding:6px 11px}
.chip.pmain{background:var(--ui);border-color:var(--ink);color:var(--ui-on)}
.pleg{display:flex;flex-wrap:wrap;gap:6px 12px;font:600 .75rem var(--font-ui)}
.pleg[hidden]{display:none}
.lg.ok{color:var(--ok)}.lg.bad,.lg.miss{color:var(--bad)}
.rd.prac .w{cursor:default}
.rd.prac .w.f .t{color:var(--fg)}
.rd.prac .w.on{background:none;box-shadow:none}
.rd.prac .w.on .t{color:inherit;font-weight:inherit;text-decoration:none}
.rd.prac .w:hover{background:none}
.rd.prac .w.pdim{opacity:.38}
.rd.prac .w[role=button]{cursor:pointer}
.rd.prac .w[role=button]:hover{background:var(--accent-soft)}
.rd.prac .w:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rd.prac .w.pk{background:var(--accent);box-shadow:0 0 0 2px var(--ink)}
.rd.prac .w.pk .t{color:var(--on)}
.rd.prac .w.ok{background:var(--ok-bg);box-shadow:0 0 0 2px var(--ok)}
.rd.prac .w.ok .t{color:var(--ok);font-weight:700}
.rd.prac .w.ok .t::after{content:" ✓";font-size:.7em}
.rd.prac .w.bad{background:var(--bad-bg);box-shadow:0 0 0 2px var(--bad)}
.rd.prac .w.bad .t{color:var(--bad);font-weight:700;text-decoration:line-through}
.rd.prac .w.bad .t::after{content:" ✗";font-size:.7em;text-decoration:none;display:inline-block}
.rd.prac .w.miss{outline:2px dashed var(--bad);outline-offset:1px}
.rd.prac .w.miss .t{color:var(--bad);font-weight:700}
.rd.prac .w.rev{box-shadow:0 0 0 2px var(--accent-text)}
.rd.prac .ph{display:none!important}
.rd.prac .w.ok,.rd.prac .w.bad,.rd.prac .w.miss,.rd.prac .w.rev{white-space:nowrap}
.pa{font:700 .72em var(--font-ui);color:var(--ok);margin-left:.3em;white-space:nowrap}
.pa::before{content:"→ "}
.pa.hint{color:var(--accent-text)}
.w.miss .pa,.w.bad .pa{color:var(--ok)}
.pin{font:inherit;color:var(--fg);background:var(--field);border:2px solid var(--ink);border-radius:8px;padding:0 .25em;margin:0 .1em;min-width:7.5ch;max-width:100%;height:1.5em;vertical-align:baseline;text-align:center}
.pin:focus{outline:3px solid var(--accent);outline-offset:1px}
.pin.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.pin.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700}

.rd .prow input[type=checkbox]{flex:none;width:22px;height:22px;margin:0;accent-color:var(--ui)}

/* ---- latihan: pilih kata ---- */
.dq{position:fixed;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);font-family:var(--font-ui)}
.dq[hidden]{display:none}
.dqh{display:flex;align-items:center;gap:12px;width:100%;max-width:var(--col);margin:0 auto;padding:14px 16px}
.dqx{flex:none;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);background:var(--bar);color:var(--head);font:700 1rem var(--font-ui);cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.dqbar{flex:1;height:14px;border-radius:7px;background:var(--line);border:2.5px solid var(--ink);overflow:hidden}
.dqbar i{display:block;height:100%;width:0;background:var(--ui);transition:width .3s}
.dqn{flex:none;min-width:3.2em;text-align:right;font:700 .85rem var(--font-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.dqm{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;width:100%;max-width:var(--col);margin:0 auto;padding:8px 20px;display:flex;flex-direction:column;justify-content:center}
.dqq{display:flex;flex-direction:column;align-items:center;gap:22px}
.dqq[hidden],.dqres[hidden]{display:none}
.dqtag{font:600 .85rem/1.4 var(--font-ui);color:var(--accent-text);background:var(--accent-soft);padding:8px 14px;border-radius:12px;text-align:center}
.dqplay{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--accent);color:var(--on);display:grid;place-items:center;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.dqplay svg{width:26px;height:26px}
.dqs{margin:0;text-align:center;font:700 calc(var(--fs)*1.1px)/1.9 var(--font-read);color:var(--head);text-wrap:balance}
.dqk{display:inline-block;min-width:5.2em;min-height:1.55em;line-height:1.3;padding:.05em .4em;margin:0 .15em;vertical-align:middle;border:2.5px dashed var(--ink);border-radius:10px;background:var(--field);color:var(--fg);font:inherit;cursor:pointer}
.dqk.filled{border-style:solid}
.dqk.hov{background:var(--accent-soft);border-style:solid}
.dqk.ok{border:2.5px solid var(--ok);background:var(--ok-bg);color:var(--ok)}
.dqk.bad{border:2.5px solid var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.dqch{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:3.6em}
.dqc{touch-action:none;user-select:none;-webkit-user-select:none;font:700 1.1rem var(--font-ui);padding:10px 16px;border:2.5px solid var(--ink);border-radius:12px;background:var(--bar);color:var(--fg);box-shadow:3px 3px 0 var(--shadow);cursor:grab}
.dqc.used,.dqc.lift{opacity:.3;box-shadow:none}
.dqc:disabled{cursor:default}
.dqc.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:30;cursor:grabbing;opacity:1;box-shadow:5px 5px 0 var(--shadow)}
.dqf{width:100%;max-width:var(--col);margin:0 auto;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.dqfb{border:2.5px solid;border-radius:14px;padding:10px 14px;font-size:.95rem;line-height:1.45}
.dqfb[hidden]{display:none}
.dqfb.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dqfb.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.dqfb small{display:block;margin-top:4px;font-size:.85rem;color:var(--fg)}
.dqok{font:700 1.05rem var(--font-ui);border:2.5px solid var(--ink);border-radius:14px;padding:14px;background:var(--ui);color:var(--ui-on);box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.dqok:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.dqres h2{margin:0 0 8px;font:700 1.6rem var(--font-display);color:var(--head);text-align:center}
.dqrt{margin:0 0 10px;color:var(--muted);text-align:center;font-weight:600}
.dqres ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dqres li{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bar);font-size:.95rem;line-height:1.45}
.dqres li small{display:block;margin-top:4px;color:var(--muted)}
.dqk.act{border-style:solid;box-shadow:0 0 0 3px var(--accent)}
.dqk{min-width:4.2em}
.dqfb{max-height:36vh;overflow:auto}
.dqfb ul{margin:6px 0 0;padding-left:0;list-style:none;font-size:.85rem;line-height:1.45;color:var(--fg)}
.dqfb li{margin-top:3px}
.dqs{font-size:calc(var(--fs)*1px)}
.dqfb{max-height:none;overflow:visible;padding:0}
.dqfh{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:10px 14px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.dqfh:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;border-radius:12px}
.dqfc{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;transition:transform .25s}
.dqfc svg{width:20px;height:20px}
.dqfb.min .dqfc{transform:rotate(180deg)}
.dqfbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.dqfbody>div{min-height:0;overflow:hidden}
.dqfb.min .dqfbody{grid-template-rows:0fr}
.dqfbody ul{max-height:30vh;overflow:auto;margin:0;padding:0 14px 10px}
@media (prefers-reduced-motion:reduce){.dqfbody,.dqfc{transition:none}}
.ld{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--muted);font:500 1.05rem/1.5 var(--font-ui)}
.ld p{margin:0}
.ttsb .ts-go,.ttsb .ts-x{font:700 .8rem var(--font-ui);border:2.5px solid var(--ink);border-radius:999px;background:var(--accent);color:var(--on);padding:6px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.ttsb .ts-x{background:var(--bar);color:var(--head)}
.ttsb button:disabled,.ttsb select:disabled{opacity:.55;cursor:default}
.ttsb .ts-st{flex-basis:100%;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--bar);color:var(--head);font:600 .85rem/1.4 var(--font-ui)}
.ttsb .ts-st.err{border-color:var(--warn);color:var(--warn)}
.ttsb .ts-p{width:100%;height:10px;accent-color:var(--ui)}
.ttsb .ts-h{flex-basis:100%;font-weight:500;color:var(--muted)}
.ttsb .ts-h:empty{display:none}
.ld a{color:var(--head);font:600 1rem var(--font-display);text-decoration:none;padding:10px 22px;border:2.5px solid var(--ink);border-radius:999px;background:var(--bar);box-shadow:3px 3px 0 var(--shadow)}

function preprocessText(text, lang) {
  let t = String(text).normalize("NFKD");
  t = t.replace(/[\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}\uFE0F\u200D]/gu, "");
  const map = {
    "–":"-","‑":"-","—":"-","¯":" ","_":" ","“":'"',"”":'"',"‘":"'","’":"'",
    "´":"'","`":"'","[":" ","]":" ","|":" ","/":" ","#":" ","→":" ","←":" "

  t = t.replace(/[–‑—¯_“”‘’´`\[\]|\/#→←]/g, c => map[c]);
  t = t.replace(/[♥☆♡©\\]/g, "");
  if (lang === "en") {
    t = t.replace(/@/g, " at ").replace(/\be\.g\.,/gi, "for example,").replace(/\bi\.e\.,/gi, "that is,");
  }
  t = t.replace(/\s+([,.!?;:])/g, "$1");
  t = t.replace(/\s+/g, " ").trim();
  if (!t) return "";
  if (!/[.!?;:,'")\]}…。」』】〉》›»]$/.test(t)) t += ".";
  return `<${lang}>${t}</${lang}>`;
}

function splitIntoChunks(text, maxLen = 280) {
  const clean = String(text).replace(/\r/g, "").trim();
  if (!clean) return [];
  const sentences = [];
  for (const para of clean.split(/\n+/)) {
    for (const s of para.split(/(?<=[.!?。！？]["')\]]*)\s+/)) {
      const st = s.trim();
      if (st) sentences.push(st);
    }
  }
  const chunks = [];
  let cur = "";
  const flush = () => { if (cur) { chunks.push(cur); cur = ""; } };
  for (const s of sentences) {
    if (s.length > maxLen) {
      flush();
      let rest = s;
      while (rest.length > maxLen) {
        let cut = Math.max(rest.lastIndexOf(", ", maxLen), rest.lastIndexOf(" ", maxLen));
        if (cut < maxLen * 0.4) cut = maxLen;
        chunks.push(rest.slice(0, cut + 1).trim());
        rest = rest.slice(cut + 1).trim();
      }
      cur = rest;
      continue;
    }
    if (cur && (cur + " " + s).length > maxLen) flush();
    cur = cur ? cur + " " + s : s;
  }
  flush();
  return chunks.filter(Boolean);
}

function textToIds(text, indexer) {
  const ids = [];
  for (const ch of text) {
    const cp = ch.codePointAt(0);
    const v = Array.isArray(indexer) ? indexer[cp] : indexer[String(cp)];
    if (typeof v === "number" && v >= 0) ids.push(v);
  }
  return ids;
}

function gaussian() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function concatAudio(parts, sampleRate, gapSec = 0.25) {
  const gap = Math.floor(sampleRate * gapSec);
  let total = 0;
  parts.forEach((p, i) => { total += p.length + (i < parts.length - 1 ? gap : 0); });
  const out = new Float32Array(total);
  let o = 0;
  parts.forEach((p, i) => {
    out.set(p, o);
    o += p.length + (i < parts.length - 1 ? gap : 0);
  });
  return out;
}

function floatToWav(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const w = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE");
  w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Uint8Array(buf);
}

function parseWav(arrayBuffer) {
  const v = new DataView(arrayBuffer);
  if (v.byteLength < 44) return null;
  const tag = o => String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
  if (tag(0) !== "RIFF" || tag(8) !== "WAVE") return null;
  let off = 12, fmt = null, dataOff = -1, dataLen = 0;
  while (off + 8 <= v.byteLength) {
    const id = tag(off);
    let size = v.getUint32(off + 4, true);
    const body = off + 8;
    if (id === "fmt ") {
      fmt = {
        format: v.getUint16(body, true),
        channels: v.getUint16(body + 2, true),
        sampleRate: v.getUint32(body + 4, true),
        bits: v.getUint16(body + 14, true)
      };
    } else if (id === "data") {
      // Header streaming kadang bernilai 0 atau 0xFFFFFFFF: anggap data sampai akhir file.
      if (size === 0 || size === 0xffffffff || body + size > v.byteLength) size = v.byteLength - body;
      dataOff = body;
      dataLen = size;
      break;
    }
    off = body + size + (size & 1);
  }
  if (!fmt || dataOff < 0 || !fmt.channels) return null;
  const bytes = fmt.bits / 8;
  const frames = Math.floor(dataLen / (bytes * fmt.channels));
  const out = new Float32Array(frames);
  for (let i = 0; i < frames; i++) {
    const pos = dataOff + i * bytes * fmt.channels; // hanya kanal pertama
    if (fmt.format === 1 && fmt.bits === 16) out[i] = v.getInt16(pos, true) / 32768;
    else if (fmt.format === 3 && fmt.bits === 32) out[i] = v.getFloat32(pos, true);
    else return null;
  }
  return { samples: out, sampleRate: fmt.sampleRate };
}

function normalizeVoices(raw) {
  const out = {};
  if (!raw || typeof raw !== "object") return out;

  for (const [k, info] of entries) {

    if (!key || !PIPER_KEY_RE.test(key)) continue;
    out[key] = info && typeof info === "object" ? info : {};
  }
  return out;
}

  function pocketWorker(){

  function pocketCall(w,msg,doneType,h){

      w.onmessage=ev=>{const m=ev.data;
        if(m.type==='download'){if(m.cached)h.lib&&h.lib('Memuat model dari cache browser…');else if(m.total)h.lib&&h.lib('Sedang mengunduh '+m.label+'… '+mb(m.loaded)+' / '+mb(m.total)+' MB',m.loaded/m.total)}
        else if(m.type==='status'){if(m.state==='loading'&&h.st)h.st(m.status)}
        else if(m.type==='voices_loaded')h.onVoices&&h.onVoices(m.voices||[]);
        else if(m.type==='audio_chunk')h.onAudio&&h.onAudio(m.data);
        else if(m.type==='error')rej(new Error(m.error));

          piperIdx++;piperLib=null;delete MODEL[mkey(e,L)];st('Mencoba sumber library Piper lain…');continue}
        throw x}}}
  async function neuralOnce(e,v0,L,T,S,st,ck,id){
    setCancel(false);prog.clear();expect=expectOf(e);onProg=(l,t)=>st(dlText(l,t),Math.max(t,expect)?l/Math.max(t,expect):null);
    try{
      st('Menyiapkan model '+ENG[e].n+'…');
      const M=await model(e,L,st),u=await M.use(v0);
      if(u.warm){st('Sedang mengunduh model suara…');await u.warm()}
      onProg=null;expect=0;await doneFiles();
      const parts=[];let sr=0,pos=0;
      for(let k=0;k<S.length;k++){
        if(cancel){const c=new Error('dibatalkan');c.cancel=1;throw c}
        st('Membuat suara ('+ENG[e].n+')… kalimat '+(k+1)+'/'+S.length,k/S.length);
        const r=await u.syn(txt(T,S[k]));if(!sr)sr=r.sr;
        const len=r.audio.length/r.sr;
        place(T,S[k],pos/sr,len);parts.push(r.audio);pos+=r.audio.length;
        const g=new Float32Array(Math.round(gapAfter(T,S,k)*sr));parts.push(g);pos+=g.length}
      const f=new Float32Array(pos);let o=0;parts.forEach(a=>{f.set(a,o);o+=a.length});
      const b=wav(f,sr);
      if(ck){try{await ck.put(id+'.json',new Response(JSON.stringify({t:T.map(x=>[x.s,x.e]),v:u.v})));await ck.put(id+'.wav',new Response(b))}catch(_){}}
      return{blob:b,v:u.v}
    }finally{onProg=null;expect=0}}

  // pengganti <audio> untuk Web Speech API: jam sendiri + sinkron lewat event boundary
  function wsAudio(T,S,L,tag,vn){
    const a=new EventTarget(),end=T[T.length-1].e+.3;
    let t=0,paused=true,ended=false,rate=1,seg=0,iv=0,last=0,tok=0;
    const fire=n=>a.dispatchEvent(new Event(n));
    const segOf=x=>{for(let k=S.length-1;k>=0;k--)if(x>=T[S[k][0]].s-.001)return k;return 0};
    function speak(k,from){
      speechSynthesis.cancel();seg=k;const my=++tok;
      const idx=S[k].filter(i=>i>=from);if(!idx.length){nxt(k);return}
      let s='';const offs=[];idx.forEach(i=>{offs.push(s.length);s+=T[i].w+' '});
      const u=new SpeechSynthesisUtterance(s.trim());u.lang=tag;u.rate=rate;
      const vl=gv(),V=(vn&&vl.find(x=>x.name===vn))||vl.find(x=>x.lang.replace('_','-').toLowerCase()===tag.toLowerCase())||vl.find(x=>lc(x.lang)===L);if(V){u.voice=V;u.lang=V.lang}
      u.onboundary=e=>{if(my!==tok||paused)return;let q=0;while(q+1<offs.length&&offs[q+1]<=e.charIndex)q++;t=T[idx[q]].s};
      u.onend=u.onerror=()=>{if(my===tok&&!paused)nxt(k)};
      speechSynthesis.speak(u)}
    function nxt(k){if(k+1<S.length){t=T[S[k+1][0]].s;speak(k+1,0)}else finish()}
    function startAt(){const k=segOf(t),f=S[k].find(i=>T[i].e>t);speak(k,f===undefined?S[k][0]:f)}
    function step(){const n=performance.now(),dt=(n-last)/1000;last=n;if(paused)return;
      t+=dt*rate;const lim=T[S[seg][S[seg].length-1]].e;if(t>lim)t=lim}
    function finish(){clearInterval(iv);paused=true;ended=true;t=end;tok++;fire('pause');fire('ended')}
    Object.defineProperties(a,{
      currentTime:{get:()=>t,set:x=>{t=Math.max(0,Math.min(+x||0,end));ended=false;setTimeout(()=>fire('seeked'),0);if(!paused)startAt()}},
      duration:{get:()=>end},paused:{get:()=>paused},ended:{get:()=>ended},
      playbackRate:{get:()=>rate,set:x=>{rate=+x||1;if(!paused)startAt()}}});
    a.loop=false;a.src='';
    a.play=()=>{if(!paused)return Promise.resolve();if(t>=end-.05)t=0;ended=false;paused=false;last=performance.now();
      clearInterval(iv);iv=setInterval(step,40);fire('play');startAt();return Promise.resolve()};
    a.pause=()=>{if(paused)return;paused=true;tok++;speechSynthesis.cancel();clearInterval(iv);fire('pause')};
    setTimeout(()=>fire('loadedmetadata'),0);
    return a}
  function webAudio(T,L,lang,vn){
    if(!('speechSynthesis' in window))throw Error('Browser tidak mendukung Web Speech API');
    const S=segs(T);let c=0;
    S.forEach((s,k)=>{const len=Math.max(.6,txt(T,s).length/14);place(T,s,c,len);c+=len+gapAfter(T,S,k)});
    return wsAudio(T,S,L,bcp(lang,L),vn)}

  const probe=src=>new Promise(res=>{const a=new Audio(),tm=setTimeout(()=>done(1),8000);
    function done(ok){clearTimeout(tm);a.onloadedmetadata=a.onerror=null;a.removeAttribute('src');res(ok)}
    a.preload='metadata';a.onloadedmetadata=()=>done(1);a.onerror=()=>done(0);a.src=src});

  /* bilah di atas teks: sumber (Audio/TTS), model, daftar suara, tombol buat suara, dan status unduhan.
     S = {T,key,lang,hasAudio,useTts,note,auto,apply(el,info)} */
  function bar(app,S){
    const rd=app.querySelector('.rd');if(!rd)return;
    const L=lc(S.lang),T=S.T,SG=segs(T),P=pref();
    let e=ENG[P.e]&&supports(P.e,L)?P.e:'web',v=P.v||'',busy=false,tok=0;
    const d=document.createElement('div');d.className='ttsb';
    d.innerHTML='<span class="ts-l"></span><select class="ts-s" aria-label="Sumber suara"></select><select class="ts-e" aria-label="Model TTS"></select><select class="ts-v" aria-label="Daftar suara"></select><button type="button" class="ts-go">Buat suara</button><button type="button" class="ts-x" hidden>Jeda unduhan</button><div class="ts-st" role="status" aria-live="polite" hidden><span class="ts-t"></span><progress class="ts-p" max="100"></progress></div><span class="ts-h"></span>';
    const $=s=>d.querySelector(s),sv=$('.ts-s'),ev=$('.ts-e'),vv=$('.ts-v'),go=$('.ts-go'),xb=$('.ts-x'),box=$('.ts-st'),tt=$('.ts-t'),pg=$('.ts-p'),hint=$('.ts-h');
    const opts=(sel,list,cur)=>{sel.textContent='';list.forEach(x=>{const o=document.createElement('option');o.value=x[0];o.textContent=x[1];sel.appendChild(o)});if(cur!==undefined)sel.value=cur};
    const st=(m,f)=>{box.hidden=false;box.classList.remove('err');tt.textContent=m;pg.hidden=false;if(f==null)pg.removeAttribute('value');else pg.value=Math.max(0,Math.min(100,Math.round(f*100)))};
    const msg=(m,err)=>{box.hidden=false;box.classList.toggle('err',!!err);tt.textContent=m;pg.hidden=true};
    const lock=b=>{busy=b;[sv,ev,vv,go].forEach(x=>{x.disabled=b});xb.hidden=!b};
    $('.ts-l').textContent=(S.hasAudio?'🔊 Sumber suara':'🔊 Tidak ada audio. Pilih model dan suara')+' · '+langName(L);
    opts(sv,[['audio','Audio'],['tts','TTS (suara otomatis)']],S.useTts?'tts':'audio');sv.hidden=!S.hasAudio;
    opts(ev,Object.keys(ENG).filter(k=>supports(k,L)).map(k=>[k,ENG[k].n]),e);
    [ev,vv,go].forEach(x=>{x.hidden=!S.useTts});
    const setHint=()=>{const r='Jika terputus atau tab ditutup, unduhan dilanjutkan, bukan diulang dari awal.';
      hint.textContent=!S.useTts?'':e==='web'?'':e==='piper'?'Piper: daftar semua suara untuk bahasa ini. ✓ = sudah terpasang di browser. Suara yang dipilih diunduh dulu. '+r:
        e==='pocket'?(POCKET_BUNDLES[L]?'':'Bahasa ini belum punya paket Pocket TTS, jadi dibaca dengan paket Inggris (beraksen Inggris). ')+'Paket bahasa (±125 MB) diunduh saat model dipilih. '+r:
        'Model diunduh saat dipilih. '+r};
    setHint();
    async function fill(sel){
      const my=++tok;vv.disabled=true;opts(vv,[['','Memuat daftar suara…']]);
      let list=[];
      try{list=await listVoices(e,L)}catch(x){if(my===tok)msg('Daftar suara gagal dimuat: '+(x&&x.message||x),true)}
      if(my!==tok)return;
      const first=e==='web'?[['','Otomatis']]:e==='pocket'?[['','Suara bawaan model']]:[['','— Pilih suara —']];
      opts(vv,first.concat(list),list.some(x=>x[0]===sel)?sel:'');
      vv.disabled=busy;
      if(e==='web'&&!list.length&&gv().length)msg('Browser ini belum punya suara untuk bahasa '+langName(L)+'. Coba Piper atau Pocket TTS.',true)}
    function fail(x){
      lock(false);
      if(x&&x.cancel)msg('Unduhan dijeda. Bagian yang sudah terunduh tersimpan; tekan "Buat suara" untuk melanjutkan.',true);
      else msg('Gagal: '+(x&&x.message||x)+'. Unduhan yang sudah selesai tidak diulang; coba lagi untuk melanjutkan.',true)}
    async function make(){
      if(busy)return;
      e=ev.value;v=vv.value;
      if((e==='piper'||e==='super')&&!v){msg('Pilih suara dari daftar dulu.',true);return}
      if(e==='web'){
        try{setPref({src:'tts',e,v,pending:null});S.apply(webAudio(T,L,S.lang,v),{note:'Suara: '+ENG.web.n+(v?' · '+v:'')})}catch(x){msg('Gagal: '+(x&&x.message||x),true)}
        return}
      setPref({src:'tts',e,v,pending:{e,v}});lock(true);
      try{
        const r=await neural(e,v,L,T,SG,S.key,st);
        setPref({v:r.v,pending:null});
        S.apply(new Audio(URL.createObjectURL(r.blob)),{note:'Suara siap: '+ENG[e].n+' · '+r.v})
      }catch(x){fail(x)}}
    async function prep(){
      if(busy||!(e==='super'||e==='super8'||e==='pocket'))return;
      if(ready(e,L)){msg('Model '+ENG[e].n+' sudah siap. Pilih suara.');return}
      setPref({e,pending:{e,v:'',prep:1}});lock(true);
      try{
        await prepModel(e,L,st);
        setPref({pending:null});lock(false);
        await fill(v);msg('Model '+ENG[e].n+' siap. Pilih suara dari daftar.')
      }catch(x){fail(x)}}
    sv.onchange=()=>{setPref({src:sv.value});location.reload()};
    ev.onchange=()=>{e=ev.value;v='';setPref({e,v:''});setHint();fill('');prep()};
    vv.onchange=()=>{v=vv.value;if(v||e==='web'||e==='pocket')make()};
    go.onclick=()=>make();
    xb.onclick=()=>{setPref({pending:null});setCancel(true);msg('Menjeda…')};
    try{speechSynthesis.onvoiceschanged=()=>{if(ev.value==='web'&&!busy)fill(vv.value||v)}}catch(_){}
    const put=()=>{const a=rd.querySelector('.rtxt');if(a&&a.previousElementSibling!==d)a.before(d)};
    put();new MutationObserver(put).observe(rd,{childList:true});
    async function auto(){
      const pd=P.pending;
      if(pd&&ENG[pd.e]&&supports(pd.e,L)){e=pd.e;v=pd.v||'';ev.value=e;setHint();await fill(v);vv.value=v;msg('Melanjutkan unduhan sebelumnya…');if(pd.prep)prep();else make();return}
      await fill(v);vv.value=v;
      if(e==='web'){make();return}
      if(v&&await cached(T,S.key,e,L,v)){make();return}
      msg('Pilih model dan suara dari daftar. Model diunduh dulu, statusnya tampil di sini.')}
    if(S.useTts){
      if(S.auto)auto();else{fill(v);if(S.note)msg(S.note)}}
    else if(S.note)msg(S.note)}

  return{probe,pref,setPref,bar,ENG}
})();

<script type="text/plain" id="pocketWorkerSrc">
let ort = null;

const DEFAULT_LANGUAGE = "english_2026-04";
const LANGUAGE_BUNDLES = ["english_2026-04", "german", "italian", "portuguese", "spanish"];
const MODEL_STEMS = {
    mimi_encoder: "mimi_encoder_int8.onnx",
    text_conditioner: "text_conditioner_int8.onnx",
    flow_lm_main: "flow_lm_main_int8.onnx",
    flow_lm_flow: "flow_lm_flow_int8.onnx",
    mimi_decoder: "mimi_decoder_int8.onnx",
};
const DEBUG_LOGS = false;
const CHUNK_GAP_SEC = 0.25;
const MAX_FRAMES = 500;
const LSD_STEPS = 1;
const RESET_FLOW_STATE_EACH_CHUNK = true;
const RESET_MIMI_STATE_EACH_CHUNK = true;

let currentLanguage = DEFAULT_LANGUAGE;
let currentBundleDir = null;
let bundleMetadata = null;
let tokenizerProcessor = null;
let tokenizerModelB64 = null;
let bosBeforeVoice = null;

let mimiEncoderSession = null;
let textConditionerSession = null;
let flowLmMainSession = null;
let flowLmFlowSession = null;
let mimiDecoderSession = null;

let currentSampleRate = 24000;
let currentSamplesPerFrame = 1920;
let currentLatentDim = 32;
let currentConditioningDim = 1024;
let currentMaxTokenPerChunk = 50;

let predefinedVoiceRecords = {};
let customVoiceEmbedding = null;
let currentVoiceName = null;
let voiceConditioningCache = new Map();

let stTensors = [];
let isGenerating = false;
let isReady = false;

const HF_BASE = "https://huggingface.co/spaces/KevinAHM/pocket-tts-web/resolve/main/";
const CACHE_NAME = "pocket-tts-hf-v1";

function bundleDir(language) {
    return `${HF_BASE}onnx/${language}`;
}

function bundlePath(language, filename) {
    return `${bundleDir(language)}/${filename}`;
}

let lastProgressAt = 0;
async function fetchCached(url, label) {
    let cache = null;
    try {
        cache = await caches.open(CACHE_NAME);
        const hit = await cache.match(url);
        if (hit) {
            postMessage({ type: "download", label, loaded: 1, total: 1, cached: true });
            return await hit.arrayBuffer();
        }
    } catch (e) {
        cache = null;
    }
    const res = await fetch(url, { mode: "cors" });
    if (!res.ok) throw new Error(`Gagal mengunduh ${label} (HTTP ${res.status})`);
    const total = Number(res.headers.get("content-length")) || 0;
    const reader = res.body.getReader();
    const parts = [];
    let got = 0;
    for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        got += value.length;
        const now = performance.now();
        if (now - lastProgressAt > 120) {
            lastProgressAt = now;
            postMessage({ type: "download", label, loaded: got, total });
        }
    }
    const out = new Uint8Array(got);
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    postMessage({ type: "download", label, loaded: got, total: got });
    try { if (cache) await cache.put(url, new Response(out)); } catch (e) { /* kuota penuh: abaikan */ }
    return out.buffer;
}

let spModule = null;
async function loadSentencePiece() {
    if (spModule) return spModule;
    const buf = await fetchCached(HF_BASE + "sentencepiece.js", "sentencepiece.js");
    const url = URL.createObjectURL(new Blob([buf], { type: "text/javascript" }));
    spModule = await import(url);
    return spModule;
}

function debugLog(...args) {
    if (DEBUG_LOGS) {
        console.log(...args);
    }
}

function makeFilledArray(shape, dtype, fill) {
    const size = shape.reduce((a, b) => a * b, 1);
    let data;

    if (dtype === "int64") {
        data = new BigInt64Array(size);
    } else if (dtype === "bool") {
        data = new Uint8Array(size);
    } else {
        data = new Float32Array(size);
        if (fill === "nan") {
            data.fill(NaN);
        } else if (fill === "ones") {
            data.fill(1);
        }
    }

    return data;
}

function createTensor(dtype, data, dims) {
    return new ort.Tensor(dtype, data, dims);
}

function initStateFromManifest(manifest) {
    const state = {};
    for (const entry of manifest) {
        state[entry.input_name] = createTensor(
            entry.dtype,
            makeFilledArray(entry.shape, entry.dtype, entry.fill),
            entry.shape
        );
    }
    return state;
}

function cloneState(state) {
    return { ...state };
}

function updateStateFromManifestOutputs(state, result, manifest) {
    for (const entry of manifest) {
        state[entry.input_name] = result[entry.output_name];
    }
}

function groupVoiceRecordByModule(record) {
    const grouped = {};
    for (const [key, value] of Object.entries(record)) {
        const slash = key.indexOf("/");
        if (slash === -1) continue;
        const moduleName = key.slice(0, slash);
        const tensorKey = key.slice(slash + 1);
        if (!grouped[moduleName]) {
            grouped[moduleName] = {};
        }
        grouped[moduleName][tensorKey] = value;
    }
    return grouped;
}

function adaptTypedArray(source, entry) {
    const targetShape = entry.shape;
    const targetSize = targetShape.reduce((a, b) => a * b, 1);
    const target = makeFilledArray(targetShape, entry.dtype, entry.fill);

    if (source.shape.length === targetShape.length) {
        const exactShape = source.shape.every((dim, idx) => dim === targetShape[idx]);
        if (exactShape) {
            if (entry.dtype === "int64") {
                return new BigInt64Array(source.data);
            }
            if (entry.dtype === "bool") {
                return new Uint8Array(source.data);
            }
            return new Float32Array(source.data);
        }
    }

    if (source.data.length === targetSize) {
        if (entry.dtype === "int64") {
            return new BigInt64Array(source.data);
        }
        if (entry.dtype === "bool") {
            return new Uint8Array(source.data);
        }
        return new Float32Array(source.data);
    }

    if (source.shape.length !== targetShape.length) {
        return target;
    }

    const strides = [];
    let stride = 1;
    for (let i = source.shape.length - 1; i >= 0; i--) {
        strides[i] = stride;
        stride *= source.shape[i];
    }

    const indices = new Array(source.shape.length).fill(0);
    const maxIndices = source.shape.map((dim, idx) => Math.min(dim, targetShape[idx]));

    function targetIndex(coords) {
        let idx = 0;
        let tStride = 1;
        for (let i = targetShape.length - 1; i >= 0; i--) {
            idx += coords[i] * tStride;
            tStride *= targetShape[i];
        }
        return idx;
    }

    let done = false;
    while (!done) {
        let sourceIdx = 0;
        for (let i = 0; i < indices.length; i++) {
            sourceIdx += indices[i] * strides[i];
        }
        target[targetIndex(indices)] = source.data[sourceIdx];

        for (let dim = indices.length - 1; dim >= 0; dim--) {
            indices[dim] += 1;
            if (indices[dim] < maxIndices[dim]) {
                break;
            }
            indices[dim] = 0;
            if (dim === 0) {
                done = true;
            }
        }
    }

    return target;
}

function deriveStep(moduleState) {
    if (moduleState.step) {
        return { data: BigInt64Array.from([BigInt(moduleState.step.data[0])]), shape: [1], dtype: "int64" };
    }
    if (moduleState.offset && !moduleState.end_offset) {
        return { data: BigInt64Array.from([BigInt(moduleState.offset.data[0])]), shape: [1], dtype: "int64" };
    }
    if (moduleState.current_end) {
        return { data: BigInt64Array.from([BigInt(moduleState.current_end.shape[0])]), shape: [1], dtype: "int64" };
    }
    return { data: BigInt64Array.from([0n]), shape: [1], dtype: "int64" };
}

function stateFromVoiceRecord(record) {
    const grouped = groupVoiceRecordByModule(record);
    const state = initStateFromManifest(bundleMetadata.flow_lm_state_manifest);

    for (const entry of bundleMetadata.flow_lm_state_manifest) {
        const moduleState = grouped[entry.module] || {};
        let source = moduleState[entry.key];
        if (!source && entry.key === "step") {
            source = deriveStep(moduleState);
        }
        if (!source) {
            continue;
        }

        const data = adaptTypedArray(source, entry);
        state[entry.input_name] = createTensor(entry.dtype, data, entry.shape);
    }

    return state;
}

function prepareVoiceEmbeddingData(voiceEmb) {
    let data = voiceEmb.data;
    let dims = voiceEmb.shape.slice();

    if (bundleMetadata.insert_bos_before_voice && bosBeforeVoice) {
        const bosData = bosBeforeVoice.data;
        const combined = new Float32Array(bosData.length + data.length);
        combined.set(bosData, 0);
        combined.set(data, bosData.length);
        data = combined;
        dims = [1, dims[1] + bosBeforeVoice.shape[1], dims[2]];
    }

    return createTensor("float32", data, dims);
}

async function buildVoiceConditionedState(voiceEmb) {
    const flowLmState = initStateFromManifest(bundleMetadata.flow_lm_state_manifest);
    const emptySeq = createTensor("float32", new Float32Array(0), [1, 0, currentLatentDim]);
    const voiceTensor = prepareVoiceEmbeddingData(voiceEmb);

    const result = await flowLmMainSession.run({
        sequence: emptySeq,
        text_embeddings: voiceTensor,
        ...flowLmState,
    });

    updateStateFromManifestOutputs(flowLmState, result, bundleMetadata.flow_lm_state_manifest);
    return flowLmState;
}

async function ensurePredefinedVoiceCached(voiceName, options = {}) {
    const { force = false, statusText = "Preparing voice..." } = options;
    if (!predefinedVoiceRecords[voiceName]) {
        throw new Error(`Unknown built-in voice: ${voiceName}`);
    }

    if (!force && voiceConditioningCache.has(voiceName)) {
        return voiceConditioningCache.get(voiceName);
    }

    postMessage({ type: "status", status: statusText, state: "loading" });
    const conditioned = stateFromVoiceRecord(predefinedVoiceRecords[voiceName]);
    voiceConditioningCache.set(voiceName, conditioned);
    return conditioned;
}

async function ensureCustomVoiceCached(options = {}) {
    const { force = false, statusText = "Preparing custom voice..." } = options;
    if (!customVoiceEmbedding) {
        throw new Error("No custom voice loaded.");
    }

    if (!force && voiceConditioningCache.has("custom")) {
        return voiceConditioningCache.get("custom");
    }

    postMessage({ type: "status", status: statusText, state: "loading" });
    const conditioned = await buildVoiceConditionedState(customVoiceEmbedding);
    voiceConditioningCache.set("custom", conditioned);
    return conditioned;
}

function parseNpyFloat32(buffer) {
    const view = new DataView(buffer);
    const magic = new Uint8Array(buffer, 0, 6);
    const expected = [0x93, 0x4e, 0x55, 0x4d, 0x50, 0x59];
    for (let i = 0; i < expected.length; i++) {
        if (magic[i] !== expected[i]) {
            throw new Error("Invalid NPY file");
        }
    }

    const major = view.getUint8(6);
    const headerLen = major === 1 ? view.getUint16(8, true) : view.getUint32(8, true);
    const headerOffset = major === 1 ? 10 : 12;
    const headerText = new TextDecoder().decode(new Uint8Array(buffer, headerOffset, headerLen));
    const shapeMatch = headerText.match(/\(\s*([0-9,\s]+)\)/);
    if (!shapeMatch) {
        throw new Error("Could not parse NPY shape");
    }
    const shape = shapeMatch[1]
        .split(",")
        .map((part) => part.trim())
        .filter(Boolean)
        .map((part) => Number.parseInt(part, 10));
    const dataOffset = headerOffset + headerLen;
    const data = new Float32Array(buffer, dataOffset);
    return { data: new Float32Array(data), shape };
}

function parseVoiceStatesBin(buffer) {
    const view = new DataView(buffer);
    let offset = 0;
    const magic = new TextDecoder().decode(new Uint8Array(buffer, offset, 5));
    offset += 5;
    if (magic !== "PTVB1") {
        throw new Error("Invalid voices.bin header");
    }

    const voices = {};
    const voiceCount = view.getUint32(offset, true);
    offset += 4;

    for (let voiceIndex = 0; voiceIndex < voiceCount; voiceIndex++) {
        const nameLen = view.getUint16(offset, true);
        offset += 2;
        const name = new TextDecoder().decode(new Uint8Array(buffer, offset, nameLen));
        offset += nameLen;

        const tensorCount = view.getUint16(offset, true);
        offset += 2;
        const tensors = {};

        for (let tensorIndex = 0; tensorIndex < tensorCount; tensorIndex++) {
            const keyLen = view.getUint16(offset, true);
            offset += 2;
            const key = new TextDecoder().decode(new Uint8Array(buffer, offset, keyLen));
            offset += keyLen;

            const dtypeCode = view.getUint8(offset);
            offset += 1;
            const rank = view.getUint8(offset);
            offset += 1;

            const shape = [];
            for (let dimIndex = 0; dimIndex < rank; dimIndex++) {
                shape.push(view.getUint32(offset, true));
                offset += 4;
            }

            const byteLength = view.getUint32(offset, true);
            offset += 4;

            let data;
            if (dtypeCode === 0) {
                data = new Float32Array(buffer.slice(offset, offset + byteLength));
            } else if (dtypeCode === 1) {
                data = new BigInt64Array(buffer.slice(offset, offset + byteLength));
            } else if (dtypeCode === 2) {
                data = new Uint8Array(buffer.slice(offset, offset + byteLength));
            } else {
                throw new Error(`Unsupported voices.bin dtype code: ${dtypeCode}`);
            }
            offset += byteLength;

            tensors[key] = {
                data,
                shape,
                dtype: dtypeCode === 0 ? "float32" : dtypeCode === 1 ? "int64" : "bool",
            };
        }

        voices[name] = tensors;
    }

    return voices;
}

async function encodeVoiceAudio(audioData) {
    const input = createTensor("float32", audioData, [1, 1, audioData.length]);
    const outputs = await mimiEncoderSession.run({ audio: input });
    const embeddings = outputs[mimiEncoderSession.outputNames[0]];

    let dims = embeddings.dims.slice();
    let data = new Float32Array(embeddings.data);
    while (dims.length > 3) {
        if (dims[0] !== 1) break;
        dims = dims.slice(1);
    }
    if (dims.length < 3) {
        dims = [1, dims[0], dims[1]];
    }

    return { data, shape: dims };
}

function prepareTextPrompt(text) {
    let prompt = text.trim();
    if (!prompt) {
        return { text: "", framesAfterEos: 1 };
    }

    prompt = prompt.replace(/\r/g, " ").replace(/\n/g, " ").replace(/\s+/g, " ");
    if (bundleMetadata.remove_semicolons) {
        prompt = prompt.replace(/;/g, ",");
    }

    const wordCount = prompt.split(/\s+/).filter(Boolean).length;
    let framesAfterEos = wordCount <= 4 ? 3 : 1;
    if (bundleMetadata.model_recommended_frames_after_eos != null) {
        framesAfterEos = Number(bundleMetadata.model_recommended_frames_after_eos);
    }

    if (prompt && !/[A-ZÀ-Þ]/.test(prompt[0])) {
        prompt = prompt[0].toUpperCase() + prompt.slice(1);
    }
    if (prompt && /[0-9A-Za-zÀ-ÿ]/.test(prompt[prompt.length - 1])) {
        prompt += ".";
    }
    if (bundleMetadata.pad_with_spaces_for_short_inputs && wordCount < 5) {
        prompt = "        " + prompt;
    }

    return { text: prompt, framesAfterEos };
}

const SENTENCE_SPLIT_RE = /[^.!?]+[.!?]+|[^.!?]+$/g;

function splitTextIntoSentences(text) {
    const matches = text.match(SENTENCE_SPLIT_RE);
    if (!matches) return [];
    return matches.map((sentence) => sentence.trim()).filter(Boolean);
}

function splitTokenIdsIntoChunks(tokenIds, maxTokens) {
    const chunks = [];
    for (let i = 0; i < tokenIds.length; i += maxTokens) {
        const chunkText = tokenizerProcessor.decodeIds(tokenIds.slice(i, i + maxTokens)).trim();
        if (chunkText) {
            chunks.push(chunkText);
        }
    }
    return chunks;
}

function splitIntoBestSentences(text) {
    const prepared = prepareTextPrompt(text);
    if (!prepared.text) {
        return { chunks: [], framesAfterEos: prepared.framesAfterEos };
    }

    const sentences = splitTextIntoSentences(prepared.text);
    if (!sentences.length) {
        return { chunks: [prepared.text], framesAfterEos: prepared.framesAfterEos };
    }

    const chunks = [];
    let currentChunk = "";

    for (const sentenceText of sentences) {
        const sentenceTokenIds = tokenizerProcessor.encodeIds(sentenceText);
        const sentenceTokens = sentenceTokenIds.length;

        if (sentenceTokens > currentMaxTokenPerChunk) {
            if (currentChunk) {
                chunks.push(currentChunk.trim());
                currentChunk = "";
            }
            const splitChunks = splitTokenIdsIntoChunks(sentenceTokenIds, currentMaxTokenPerChunk);
            for (const splitChunk of splitChunks) {
                if (splitChunk) {
                    chunks.push(splitChunk.trim());
                }
            }
            continue;
        }

        if (!currentChunk) {
            currentChunk = sentenceText;
            continue;
        }

        const combined = `${currentChunk} ${sentenceText}`;
        const combinedTokens = tokenizerProcessor.encodeIds(combined).length;
        if (combinedTokens > currentMaxTokenPerChunk) {
            chunks.push(currentChunk.trim());
            currentChunk = sentenceText;
        } else {
            currentChunk = combined;
        }
    }

    if (currentChunk) {
        chunks.push(currentChunk.trim());
    }

    return { chunks, framesAfterEos: prepared.framesAfterEos };
}

function precomputeFlowBuffers() {
    stTensors = [];
    const dt = 1.0 / LSD_STEPS;
    for (let step = 0; step < LSD_STEPS; step++) {
        const s = step / LSD_STEPS;
        const t = s + dt;
        stTensors.push({
            s: createTensor("float32", new Float32Array([s]), [1, 1]),
            t: createTensor("float32", new Float32Array([t]), [1, 1]),
        });
    }
}

async function loadOrt() {
    if (ort) {
        return;
    }

    postMessage({ type: "status", status: "Memuat ONNX Runtime…", state: "loading" });
    const version = "1.20.0";
    const cdnBase = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${version}/dist/`;
    const ortModule = await import(`https://cdn.jsdelivr.net/npm/onnxruntime-web@${version}/dist/ort.min.mjs`);
    ort = ortModule.default || ortModule;
    ort.env.wasm.wasmPaths = cdnBase;
    ort.env.wasm.simd = true;
    ort.env.wasm.numThreads = self.crossOriginIsolated
        ? Math.min(navigator.hardwareConcurrency || 4, 8)
        : 1;
    precomputeFlowBuffers();
}

async function releaseSession(session) {
    if (!session) {
        return;
    }
    if (typeof session.release === "function") {
        await session.release();
    }
}

const SESSION_OPTIONS = { executionProviders: ["wasm"], graphOptimizationLevel: "all" };

async function createSession(language, stem, label) {
    const buf = await fetchCached(bundlePath(language, stem), label);
    postMessage({ type: "status", status: `Menyiapkan ${label}…`, state: "loading" });
    return ort.InferenceSession.create(new Uint8Array(buf), SESSION_OPTIONS);
}

async function ensureEncoder() {
    if (mimiEncoderSession) return;
    mimiEncoderSession = await createSession(currentLanguage, MODEL_STEMS.mimi_encoder, "mimi_encoder");
}

async function loadBundle(language) {
    if (!LANGUAGE_BUNDLES.includes(language)) {
        throw new Error(`Paket bahasa tidak dikenal: ${language}`);
    }
    await loadOrt();
    isReady = false;
    postMessage({ type: "status", status: `Memuat paket ${language}…`, state: "loading" });

    const metaBuf = await fetchCached(bundlePath(language, "bundle.json"), "bundle.json");
    bundleMetadata = JSON.parse(new TextDecoder().decode(metaBuf));
    currentLanguage = language;
    currentSampleRate = Number(bundleMetadata.sample_rate);
    currentSamplesPerFrame = Number(bundleMetadata.samples_per_frame);
    currentLatentDim = Number(bundleMetadata.latent_dim);
    currentConditioningDim = Number(bundleMetadata.conditioning_dim);
    currentMaxTokenPerChunk = Number(bundleMetadata.max_token_per_chunk || 50);

    await Promise.all([
        releaseSession(mimiEncoderSession),
        releaseSession(textConditionerSession),
        releaseSession(flowLmMainSession),
        releaseSession(flowLmFlowSession),
        releaseSession(mimiDecoderSession),
    ]);
    mimiEncoderSession = null; // dimuat saat dibutuhkan (kloning suara)

    textConditionerSession = await createSession(language, MODEL_STEMS.text_conditioner, "text_conditioner");
    flowLmMainSession = await createSession(language, MODEL_STEMS.flow_lm_main, "flow_lm_main");
    flowLmFlowSession = await createSession(language, MODEL_STEMS.flow_lm_flow, "flow_lm_flow");
    mimiDecoderSession = await createSession(language, MODEL_STEMS.mimi_decoder, "mimi_decoder");

    const tokBuf = await fetchCached(bundlePath(language, bundleMetadata.tokenizer_file), "tokenizer");
    const tokBytes = new Uint8Array(tokBuf);
    let bin = "";
    for (let i = 0; i < tokBytes.length; i += 0x8000) {
        bin += String.fromCharCode.apply(null, tokBytes.subarray(i, i + 0x8000));
    }
    tokenizerModelB64 = btoa(bin);
    const spm = await loadSentencePiece();
    tokenizerProcessor = new spm.SentencePieceProcessor();
    await tokenizerProcessor.loadFromB64StringModel(tokenizerModelB64);

    bosBeforeVoice = null;
    if (bundleMetadata.bos_before_voice_file) {
        try {
            const bosBuf = await fetchCached(bundlePath(language, bundleMetadata.bos_before_voice_file), "bos");
            bosBeforeVoice = parseNpyFloat32(bosBuf);
        } catch (e) { console.warn("bos_before_voice gagal dimuat", e); }
    }

    predefinedVoiceRecords = {};
    try {
        const vBuf = await fetchCached(bundlePath(language, "voices.bin"), "voices.bin");
        predefinedVoiceRecords = parseVoiceStatesBin(vBuf);
    } catch (e) { console.warn("voices.bin gagal dimuat", e); }

    voiceConditioningCache = new Map();
    let defaultVoice = bundleMetadata.predefined_voices?.includes("alba") ? "alba" : null;
    if (!defaultVoice) defaultVoice = Object.keys(predefinedVoiceRecords)[0] || null;
    currentVoiceName = defaultVoice;
    if (defaultVoice) {
        await ensurePredefinedVoiceCached(defaultVoice, { force: true, statusText: `Menyiapkan suara (${defaultVoice})…` });
    }

    isReady = true;
    postMessage({
        type: "voices_loaded",
        voices: Object.keys(predefinedVoiceRecords),
        defaultVoice,
        language,
    });
    postMessage({ type: "bundle_loaded", language, sampleRate: currentSampleRate });
}

self.onmessage = async (e) => {
    const { type, data } = e.data;
    try {
        if (type === "load_bundle") {
            if (isGenerating) throw new Error("Tidak bisa ganti paket saat sedang membuat suara.");
            await loadBundle(data.language);
            return;
        }
        if (type === "stop") {
            isGenerating = false;
            return;
        }
        if (!isReady) throw new Error("Model belum dimuat.");

        if (type === "encode_voice") {
            await ensureEncoder();
            customVoiceEmbedding = await encodeVoiceAudio(data.audio);
            voiceConditioningCache.delete("custom");
            await ensureCustomVoiceCached({ force: true, statusText: "Menyiapkan suara sendiri…" });
            postMessage({ type: "voice_encoded", voiceName: "custom" });
            return;
        }
        if (type === "generate") {
            if (isGenerating) return;
            await startGeneration(data.text, data.voice || currentVoiceName);
        }
    } catch (err) {
        console.error("Worker error:", err);
        postMessage({ type: "error", error: (err && err.message) || String(err) });
    }
};

async function startGeneration(text, voiceName) {
    isGenerating = true;
    postMessage({ type: "status", status: "Generating...", state: "running" });
    postMessage({ type: "generation_started", data: { time: performance.now() } });

    try {
        const { chunks, framesAfterEos } = splitIntoBestSentences(text);
        if (!chunks.length) {
            throw new Error("No text to generate");
        }

        if (voiceName === "custom") {
            await ensureCustomVoiceCached({ statusText: "Preparing custom voice..." });
        } else {
            await ensurePredefinedVoiceCached(voiceName, {
                statusText: `Preparing voice (${voiceName})...`,
            });
        }
        currentVoiceName = voiceName;

        await runGenerationPipeline(voiceName, chunks, framesAfterEos);
    } catch (err) {
        console.error("Generation error:", err);
        postMessage({ type: "error", error: err.toString() });
    } finally {
        if (isGenerating) {
            postMessage({ type: "stream_ended" });
            postMessage({ type: "status", status: "Finished", state: "idle" });
        }
        isGenerating = false;
    }
}

async function runGenerationPipeline(voiceName, chunks, framesAfterEos) {
    let mimiState = initStateFromManifest(bundleMetadata.mimi_state_manifest);
    const emptySeq = createTensor("float32", new Float32Array(0), [1, 0, currentLatentDim]);
    const emptyTextEmb = createTensor("float32", new Float32Array(0), [1, 0, currentConditioningDim]);
    const baseFlowState = voiceConditioningCache.get(voiceName);
    if (!baseFlowState) {
        throw new Error(`Voice conditioning cache missing for '${voiceName}'.`);
    }
    let flowLmState = cloneState(baseFlowState);

    const firstChunkFrames = 3;
    const normalChunkFrames = 12;
    const allGeneratedLatents = [];
    let isFirstAudioChunk = true;
    let totalFlowLmTime = 0;
    let totalDecodeTime = 0;
    const generationStart = performance.now();

    for (let chunkIdx = 0; chunkIdx < chunks.length; chunkIdx++) {
        if (!isGenerating) break;

        if (RESET_FLOW_STATE_EACH_CHUNK && chunkIdx > 0) {
            flowLmState = cloneState(baseFlowState);
        }
        if (RESET_MIMI_STATE_EACH_CHUNK && chunkIdx > 0) {
            mimiState = initStateFromManifest(bundleMetadata.mimi_state_manifest);
        }

        const chunkText = chunks[chunkIdx];
        let isFirstAudioChunkOfTextChunk = true;
        const tokenIds = tokenizerProcessor.encodeIds(chunkText);
        const textInput = createTensor(
            "int64",
            BigInt64Array.from(tokenIds.map((token) => BigInt(token))),
            [1, tokenIds.length]
        );

        let textEmb = (await textConditionerSession.run({ token_ids: textInput }))[textConditionerSession.outputNames[0]];
        if (textEmb.dims.length === 2) {
            textEmb = createTensor("float32", new Float32Array(textEmb.data), [1, textEmb.dims[0], textEmb.dims[1]]);
        }

        const condResult = await flowLmMainSession.run({
            sequence: emptySeq,
            text_embeddings: textEmb,
            ...flowLmState,
        });
        updateStateFromManifestOutputs(flowLmState, condResult, bundleMetadata.flow_lm_state_manifest);

        const chunkLatents = [];
        let chunkDecodedFrames = 0;
        let currentLatent = createTensor("float32", new Float32Array(currentLatentDim).fill(NaN), [1, 1, currentLatentDim]);
        let eosStep = null;
        let chunkEnded = false;
        let chunkGenTimeMs = 0;

        for (let step = 0; step < MAX_FRAMES; step++) {
            if (!isGenerating) break;
            if (step > 0 && step % 4 === 0) {
                await new Promise((resolve) => setTimeout(resolve, 0));
            }

            const stepStart = performance.now();
            const arResult = await flowLmMainSession.run({
                sequence: currentLatent,
                text_embeddings: emptyTextEmb,
                ...flowLmState,
            });
            const stepElapsed = performance.now() - stepStart;
            chunkGenTimeMs += stepElapsed;
            totalFlowLmTime += stepElapsed;

            const conditioning = arResult.conditioning;
            const eosLogit = arResult.eos_logit.data[0];
            const isEos = eosLogit > -4.0;
            if (isEos && eosStep == null) {
                eosStep = step;
            }
            const shouldStop = eosStep != null && step >= eosStep + framesAfterEos;

            const temperature = 0.7;
            const std = Math.sqrt(temperature);
            const latentData = new Float32Array(currentLatentDim);
            for (let i = 0; i < currentLatentDim; i++) {
                let u = 0;
                let v = 0;
                while (u === 0) u = Math.random();
                while (v === 0) v = Math.random();
                latentData[i] = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * std;
            }

            const dt = 1.0 / LSD_STEPS;
            for (let lsdIndex = 0; lsdIndex < LSD_STEPS; lsdIndex++) {
                const flowResult = await flowLmFlowSession.run({
                    c: conditioning,
                    s: stTensors[lsdIndex].s,
                    t: stTensors[lsdIndex].t,
                    x: createTensor("float32", latentData, [1, currentLatentDim]),
                });
                const flowDir = flowResult.flow_dir.data;
                for (let i = 0; i < currentLatentDim; i++) {
                    latentData[i] += flowDir[i] * dt;
                }
            }

            chunkLatents.push(new Float32Array(latentData));
            allGeneratedLatents.push(new Float32Array(latentData));
            currentLatent = createTensor("float32", latentData, [1, 1, currentLatentDim]);
            updateStateFromManifestOutputs(flowLmState, arResult, bundleMetadata.flow_lm_state_manifest);

            const pending = chunkLatents.length - chunkDecodedFrames;
            let decodeSize = 0;
            if (shouldStop) {
                decodeSize = pending;
            } else if (isFirstAudioChunk && pending >= firstChunkFrames) {
                decodeSize = firstChunkFrames;
            } else if (pending >= normalChunkFrames) {
                decodeSize = normalChunkFrames;
            }

            if (decodeSize > 0) {
                const decodeLatents = new Float32Array(decodeSize * currentLatentDim);
                for (let frame = 0; frame < decodeSize; frame++) {
                    decodeLatents.set(chunkLatents[chunkDecodedFrames + frame], frame * currentLatentDim);
                }

                const decoderStart = performance.now();
                const decodeResult = await mimiDecoderSession.run({
                    latent: createTensor("float32", decodeLatents, [1, decodeSize, currentLatentDim]),
                    ...mimiState,
                });
                const decoderElapsed = performance.now() - decoderStart;
                chunkGenTimeMs += decoderElapsed;
                totalDecodeTime += decoderElapsed;

                for (const entry of bundleMetadata.mimi_state_manifest) {
                    mimiState[entry.input_name] = decodeResult[entry.output_name];
                }

                chunkDecodedFrames += decodeSize;
                const audioFloat32 = new Float32Array(decodeResult[mimiDecoderSession.outputNames[0]].data);
                const isLastChunk = shouldStop && chunkIdx === chunks.length - 1;

                postMessage({
                    type: "audio_chunk",
                    data: audioFloat32,
                    metrics: {
                        bbTime: 0,
                        decTime: 0,
                        chunkDuration: audioFloat32.length / currentSampleRate,
                        genTimeSec: chunkGenTimeMs / 1000,
                        isFirst: isFirstAudioChunk,
                        isLast: isLastChunk,
                        chunkStart: isFirstAudioChunkOfTextChunk,
                    },
                }, [audioFloat32.buffer]);

                isFirstAudioChunk = false;
                isFirstAudioChunkOfTextChunk = false;
                chunkGenTimeMs = 0;
            }

            if (shouldStop) {
                chunkEnded = true;
                break;
            }
        }

        if (chunkEnded && isGenerating && chunkIdx < chunks.length - 1) {
            const gapSamples = Math.max(1, Math.floor(CHUNK_GAP_SEC * currentSampleRate));
            const silence = new Float32Array(gapSamples);
            postMessage({
                type: "audio_chunk",
                data: silence,
                metrics: {
                    bbTime: 0,
                    decTime: 0,
                    chunkDuration: gapSamples / currentSampleRate,
                    isFirst: false,
                    isLast: false,
                    isSilence: true,
                },
            }, [silence.buffer]);
        }
    }

    const totalTime = (performance.now() - generationStart) / 1000;
    const audioSeconds = allGeneratedLatents.length * currentSamplesPerFrame / currentSampleRate;
    const genTime = (totalFlowLmTime + totalDecodeTime) / 1000;
    const rtfx = genTime > 0 ? audioSeconds / genTime : 0;

    debugLog(`Generation complete for ${voiceName} in ${totalTime.toFixed(2)}s (RTFx ${rtfx.toFixed(2)}x)`);
    postMessage({
        type: "status",
        status: `Finished (RTFx: ${rtfx.toFixed(2)}x)`,
        state: "idle",
        metrics: { rtfx, genTime, totalTime, audioDuration: audioSeconds },
    });
}
