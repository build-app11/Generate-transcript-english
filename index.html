<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UK Travel Shadowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Gentium+Plus:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: one-screen practice app. Player/timer strip on top, transcript scrolls in the middle, control dock pinned at the bottom. Active line is tinted, its time chip turns red like a Tube line marker. */
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --ink: #0E1626;
  --muted: #5A6577;
  --rule: #D9DEE6;
  --accent: #D8281F;
  --accent-ink: #FFFFFF;
  --tint: #FCEAE8;
  --ipa: #1F5FB8;
  --font-en: 'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-ipa: 'Gentium Plus', 'Charis SIL', 'Noto Serif', 'DejaVu Serif', serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #141C2E; --ink: #E8ECF4; --muted: #93A0B6; --rule: #25304A;
    --accent: #FF5B50; --accent-ink: #1A0907; --tint: #2B1618; --ipa: #7DB1FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #141C2E; --ink: #E8ECF4; --muted: #93A0B6; --rule: #25304A;
  --accent: #FF5B50; --accent-ink: #1A0907; --tint: #2B1618; --ipa: #7DB1FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-en); font-size: 16px; line-height: 1.35; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 760px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.side { display: contents; }
.stage { order: 1; }
.list { order: 2; }
.dock { order: 3; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.top .sub { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; gap: 8px; align-items: center; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* stage */
.stage { flex: none; }
.ytbox { aspect-ratio: 16 / 9; width: min(100%, calc(clamp(110px, 22vh, 300px) * 16 / 9)); margin-inline: auto; background: #000; border-radius: 12px; overflow: hidden; }
.ytbox iframe { width: 100%; height: 100%; display: block; }
.timerbox { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.timerbox .big { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.timerbox p { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 0.82rem; color: var(--muted); }
.timerbox a { min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 0.82rem; font-weight: 600; text-decoration: none; }

/* transcript */
.list { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 2px; padding-block: 2px 24px; scrollbar-width: thin; }
.line { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; }
.line:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.line .tm { flex: none; width: 44px; margin-top: 3px; padding: 2px 0; text-align: center; border-radius: 6px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.line .body { flex: 1; min-width: 0; }
.ws { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.w { display: flex; flex-direction: column; }
.w b { font-weight: 600; font-size: clamp(1.1rem, 1rem + 0.35vw, 1.4rem); letter-spacing: -0.005em; }
.w i { font-family: var(--font-ipa); font-style: normal; font-size: clamp(0.95rem, 0.88rem + 0.25vw, 1.15rem); color: var(--ipa); line-height: 1.25; }
.line.music .w b { font-weight: 400; font-style: italic; color: var(--muted); }
.line.music { opacity: 0.7; }
.pinb { flex: none; width: 36px; height: 36px; margin: -4px -4px 0 0; display: grid; place-items: center; color: var(--muted); opacity: 0; border-radius: 10px; }
.line:hover .pinb, .line.pinned .pinb { opacity: 1; }
@media (hover: none) { .pinb { opacity: 0.45; } .line.pinned .pinb { opacity: 1; } }
.line.pinned .pinb { color: var(--accent); }
.line.pinned .pinb svg { fill: currentColor; }
.line.active { background: var(--tint); }
.line.active .tm { background: var(--accent); color: var(--accent-ink); }
.line.looping { box-shadow: inset 0 0 0 2px var(--accent); }
.line.looping .tm::after { content: ' ↻'; }
.noipa .w i { display: none; }
.only-pinned .line:not(.pinned) { display: none; }
.empty { padding: 28px 12px; color: var(--muted); font-size: 0.9rem; text-align: center; }
.empty[hidden] { display: none; }

/* dock */
.dock { position: relative; flex: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 22px; padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.seek { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek input { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
.btns { display: flex; align-items: center; gap: 2px; }
.tool { flex: 1; min-width: 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.72rem; font-weight: 600; color: var(--muted); border-radius: 12px; }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool .glyph { font-family: var(--font-ipa); font-size: 1.35rem; line-height: 22px; height: 22px; }
.tool[aria-pressed="true"] { color: var(--accent); }
.play { flex: none; width: 62px; height: 52px; margin-left: 4px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.play svg { width: 26px; height: 26px; fill: currentColor; stroke: none; }
.pop { position: absolute; right: 78px; bottom: calc(100% - 6px); display: flex; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
.pop[hidden] { display: none; }
.pop button { min-width: 48px; min-height: 40px; padding: 0 8px; border-radius: 10px; font-family: var(--font-mono); font-size: 0.82rem; border: 1px solid var(--rule); }
.pop button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

@media (max-width: 420px) {
  .w b { font-size: 1.1rem; }
  .pop { right: 8px; }
}
/* Laptop, desktop, tablet landscape, and short landscape phones: two columns. Video and controls on the left, transcript on the right. */
@media (min-width: 900px), (orientation: landscape) and (min-width: 560px) and (max-height: 540px) {
  .app { max-width: 1280px; display: grid; grid-template-columns: clamp(300px, 38%, 480px) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: clamp(16px, 2.4vw, 36px); row-gap: 12px; }
  .top { grid-column: 1 / -1; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; grid-column: 1; grid-row: 2; scrollbar-width: thin; padding-bottom: 2px; }
  .side > * { flex: none; }
  .list { grid-column: 2; grid-row: 2; }
  .ytbox { width: min(100%, max(220px, calc((100vh - 230px) * 16 / 9))); }
  .line { padding: 14px 16px; }
  .line .tm { width: 52px; font-size: 0.78rem; }
}
@media (min-width: 1500px) { .app { max-width: 1440px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">

    </div>
  </footer>
  </div>

  <main class="list" id="list" aria-label="Transkrip"></main>
</div>
