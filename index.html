<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UK Travel Shadowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Gentium+Plus:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: one-screen practice app. Player/timer strip on top, transcript scrolls in the middle, control dock pinned at the bottom. Active line is tinted, its time chip turns red like a Tube line marker. */
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --ink: #0E1626;
  --muted: #5A6577;
  --rule: #D9DEE6;
  --accent: #D8281F;
  --accent-ink: #FFFFFF;
  --tint: #FCEAE8;
  --ipa: #1F5FB8;
  --font-en: 'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-ipa: 'Gentium Plus', 'Charis SIL', 'Noto Serif', 'DejaVu Serif', serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #141C2E; --ink: #E8ECF4; --muted: #93A0B6; --rule: #25304A;
    --accent: #FF5B50; --accent-ink: #1A0907; --tint: #2B1618; --ipa: #7DB1FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #141C2E; --ink: #E8ECF4; --muted: #93A0B6; --rule: #25304A;
  --accent: #FF5B50; --accent-ink: #1A0907; --tint: #2B1618; --ipa: #7DB1FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-en); font-size: 16px; line-height: 1.35; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; max-width: 760px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.side { display: contents; }
.stage { order: 1; }
.list { order: 2; }
.dock { order: 3; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.top .sub { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; gap: 8px; align-items: center; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* stage */
.stage { flex: none; }
.ytbox { aspect-ratio: 16 / 9; width: min(100%, calc(clamp(110px, 22vh, 300px) * 16 / 9)); margin-inline: auto; background: #000; border-radius: 12px; overflow: hidden; }
.ytbox iframe { width: 100%; height: 100%; display: block; }
.timerbox { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.timerbox .big { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.timerbox p { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 0.82rem; color: var(--muted); }
.timerbox a { min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 0.82rem; font-weight: 600; text-decoration: none; }

/* transcript */
.list { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 2px; padding-block: 2px 24px; scrollbar-width: thin; }
.line { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer; }
.line:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.line .tm { flex: none; width: 44px; margin-top: 3px; padding: 2px 0; text-align: center; border-radius: 6px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.line .body { flex: 1; min-width: 0; }
.ws { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.w { display: flex; flex-direction: column; }
.w b { font-weight: 600; font-size: clamp(1.1rem, 1rem + 0.35vw, 1.4rem); letter-spacing: -0.005em; }
.w i { font-family: var(--font-ipa); font-style: normal; font-size: clamp(0.95rem, 0.88rem + 0.25vw, 1.15rem); color: var(--ipa); line-height: 1.25; }
.line.music .w b { font-weight: 400; font-style: italic; color: var(--muted); }
.line.music { opacity: 0.7; }
.pinb { flex: none; width: 36px; height: 36px; margin: -4px -4px 0 0; display: grid; place-items: center; color: var(--muted); opacity: 0; border-radius: 10px; }
.line:hover .pinb, .line.pinned .pinb { opacity: 1; }
@media (hover: none) { .pinb { opacity: 0.45; } .line.pinned .pinb { opacity: 1; } }
.line.pinned .pinb { color: var(--accent); }
.line.pinned .pinb svg { fill: currentColor; }
.line.active { background: var(--tint); }
.line.active .tm { background: var(--accent); color: var(--accent-ink); }
.line.looping { box-shadow: inset 0 0 0 2px var(--accent); }
.line.looping .tm::after { content: ' ↻'; }
.noipa .w i { display: none; }
.only-pinned .line:not(.pinned) { display: none; }
.empty { padding: 28px 12px; color: var(--muted); font-size: 0.9rem; text-align: center; }
.empty[hidden] { display: none; }

/* dock */
.dock { position: relative; flex: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 22px; padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.seek { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek input { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
.btns { display: flex; align-items: center; gap: 2px; }
.tool { flex: 1; min-width: 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.72rem; font-weight: 600; color: var(--muted); border-radius: 12px; }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool .glyph { font-family: var(--font-ipa); font-size: 1.35rem; line-height: 22px; height: 22px; }
.tool[aria-pressed="true"] { color: var(--accent); }
.play { flex: none; width: 62px; height: 52px; margin-left: 4px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.play svg { width: 26px; height: 26px; fill: currentColor; stroke: none; }
.pop { position: absolute; right: 78px; bottom: calc(100% - 6px); display: flex; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
.pop[hidden] { display: none; }
.pop button { min-width: 48px; min-height: 40px; padding: 0 8px; border-radius: 10px; font-family: var(--font-mono); font-size: 0.82rem; border: 1px solid var(--rule); }
.pop button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

@media (max-width: 420px) {
  .w b { font-size: 1.1rem; }
  .pop { right: 8px; }
}
/* Laptop, desktop, tablet landscape, and short landscape phones: two columns. Video and controls on the left, transcript on the right. */
@media (min-width: 900px), (orientation: landscape) and (min-width: 560px) and (max-height: 540px) {
  .app { max-width: 1280px; display: grid; grid-template-columns: clamp(300px, 38%, 480px) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: clamp(16px, 2.4vw, 36px); row-gap: 12px; }
  .top { grid-column: 1 / -1; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; grid-column: 1; grid-row: 2; scrollbar-width: thin; padding-bottom: 2px; }
  .side > * { flex: none; }
  .list { grid-column: 2; grid-row: 2; }
  .ytbox { width: min(100%, max(220px, calc((100vh - 230px) * 16 / 9))); }
  .line { padding: 14px 16px; }
  .line .tm { width: 52px; font-size: 0.78rem; }
}
@media (min-width: 1500px) { .app { max-width: 1440px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">

    </div>
  </footer>
  </div>

  <main class="list" id="list" aria-label="Transkrip"></main>
</div>

"in","ɪn"],["the","ðə"],["future","ˈfjuːʧər"],["and","ænd"],["why","waɪ"]]},{"t":607,"en":"let me know in the comments i'm curious to know","ip":"lɛt miː nəʊ ɪn ðə ˈkɒmɛnts aɪm ˈkjʊəriəs tuː nəʊ","w":[["let","lɛt"],["me","miː"],["know","nəʊ"],["in","ɪn"],["the","ðə"],["comments","ˈkɒmɛnts"],["i'm","aɪm"],["curious","ˈkjʊəriəs"],["to","tuː"],["know","nəʊ"]]},{"t":610,"en":"and I will respond to every single one of you","ip":"ænd aɪ wɪl rɪˈspɒnd tuː ˈɛvri ˈsɪŋɡᵊl wʌn ɒv juː","w":[["and","ænd"],["I","aɪ"],["will","wɪl"],["respond","rɪˈspɒnd"],["to","tuː"],["every","ˈɛvri"],["single","ˈsɪŋɡᵊl"],["one","wʌn"],["of","ɒv"],["you","juː"]]},{"t":612,"en":"as always thank you for watching","ip":"æz ˈɔːlweɪz θæŋk juː fɔː ˈwɒʧɪŋ","w":[["as","æz"],["always","ˈɔːlweɪz"],["thank","θæŋk"],["you","juː"],["for","fɔː"],["watching","ˈwɒʧɪŋ"]]},{"t":615,"en":"much love","ip":"mʌʧ lʌv","w":[["much","mʌʧ"],["love","lʌv"]]},{"t":616,"en":"peace","ip":"piːs","w":[["peace","piːs"]]},{"t":617,"en":"see you soon","ip":"siː juː suːn","w":[["see","siː"],["you","juː"],["soon","suːn"]]}];
const VIDEO_ID = '52t241OQ7Ec';
const RATES = [0.5, 0.75, 1, 1.25, 1.5];
const $ = (s) => document.querySelector(s);
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* segment ends: highlight runs until the next line, a loop stops a little after the speech ends */
DATA.forEach((d, i) => {
  const next = i < DATA.length - 1 ? DATA[i + 1].t : d.t + 5;
  const words = d.w ? d.w.length : 3;
  d.s = d.t;
  d.le = Math.min(next, d.t + Math.max(2.2, words * 0.55 + 1.3));
});
const DUR_DEFAULT = Math.ceil(DATA[DATA.length - 1].t + 8);

const list = $('#list'), seekEl = $('#seek'), tcur = $('#tcur'), tdur = $('#tdur');
const app = $('#app'), pop = $('#pop');
const playSvg = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const pauseSvg = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const pinSvg = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6zM12 14v7"/></svg>';

let mode = 'timer', yt = null, ytOk = false;
const clock = { t: 0, playing: false, last: 0 };
let rate = 1, loopIdx = null, activeIdx = -1, dragging = false;
let userScrollUntil = 0, lastLoopSeek = 0, holdUntil = 0, shownPlaying = null, lastLinkSec = -1;
let pins = new Set();
try { pins = new Set(JSON.parse(localStorage.getItem('uk-pins') || '[]')); } catch (e) {}
try { if (localStorage.getItem('uk-ipa') === '0') { app.classList.add('noipa'); $('#bIpa').setAttribute('aria-pressed', 'false'); } } catch (e) {}

/* ---------- render ---------- */
const lines = [];
DATA.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (d.m ? ' music' : '') + (pins.has(d.t) ? ' pinned' : '');
  el.dataset.i = i;
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  const body = d.w
    ? '<div class="ws">' + d.w.map(([a, b]) => '<span class="w"><b>' + esc(a) + '</b><i>' + esc(b) + '</i></span>').join('') + '</div>'
    : '<div class="ws"><span class="w"><b>' + esc(d.en) + '</b><i>' + esc(d.ip) + '</i></span></div>';
  el.innerHTML = '<span class="tm">' + fmt(d.t) + '</span><div class="body">' + body + '</div><button class="pinb" aria-label="Simpan baris" tabindex="-1">' + pinSvg + '</button>';
  list.appendChild(el);
  lines.push(el);
});
const emptyEl = document.createElement('div');
emptyEl.className = 'empty'; emptyEl.hidden = true;
emptyEl.textContent = 'Belum ada baris tersimpan. Tekan ikon pin di sebuah baris untuk menyimpannya.';
list.appendChild(emptyEl);
$('#count').textContent = DATA.length;

function updatePinUI() {
  $('#pinCount').textContent = pins.size;
  const onlyPins = app.classList.contains('only-pinned');
  emptyEl.hidden = !(onlyPins && pins.size === 0);
  const cur = Math.max(activeIdx, 0);
  $('#bPin').setAttribute('aria-pressed', pins.has(DATA[cur].t) ? 'true' : 'false');
}
function togglePin(i) {
  const t = DATA[i].t;
  if (pins.has(t)) pins.delete(t); else pins.add(t);
  lines[i].classList.toggle('pinned', pins.has(t));
  try { localStorage.setItem('uk-pins', JSON.stringify([...pins])); } catch (e) {}
  updatePinUI();
}

/* ---------- player adapter: YouTube when it can load, timer otherwise ---------- */
const ytMode = () => mode === 'yt' && ytOk;
const dur = () => { if (ytMode()) { const d = yt.getDuration(); if (d > 0) return d; } return DUR_DEFAULT; };
const time = () => (ytMode() ? yt.getCurrentTime() : clock.t);
const isPlaying = () => (ytMode() ? yt.getPlayerState() === 1 : clock.playing);
function seek(t) {
  t = Math.min(Math.max(0, t), dur());
  holdUntil = performance.now() + 450;
  if (ytMode()) yt.seekTo(t, true); else clock.t = t;
}
function play() {
  if (ytMode()) yt.playVideo();
  else { if (clock.t >= dur() - 0.1) clock.t = 0; clock.playing = true; clock.last = performance.now(); }
}
function pause() { if (ytMode()) yt.pauseVideo(); else clock.playing = false; }
function setRate(r) {
  rate = r;
  if (ytMode()) yt.setPlaybackRate(r);
  $('#speedLbl').textContent = 'Speed ' + r + '×';
  [...pop.children].forEach((b) => b.setAttribute('aria-pressed', String(parseFloat(b.dataset.r) === r)));
}

function showTimer() {
  mode = 'timer';
  $('#ytbox').hidden = true; $('#timerbox').hidden = false;
  $('#modeLbl').textContent = 'mode timer';
}
function showYT() {
  mode = 'yt';
  $('#ytbox').hidden = false; $('#timerbox').hidden = true;
  $('#modeLbl').textContent = 'sinkron YouTube';
}
function loadYouTube() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => {};
  window.onYouTubeIframeAPIReady = () => {
    try {
      yt = new YT.Player('ytplayer', {
        videoId: VIDEO_ID,
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { ytOk = true; clock.playing = false; showYT(); yt.setPlaybackRate(rate); tdur.textContent = fmt(dur()); seekEl.max = dur(); },
          onError: () => { ytOk = false; try { yt.destroy(); } catch (e) {} showTimer(); }
        }
      });
    } catch (e) { showTimer(); }
  };
  document.head.appendChild(s);
}

/* ---------- loop ---------- */
function setLoop(i) {
  if (loopIdx != null) lines[loopIdx].classList.remove('looping');
  loopIdx = i;
  if (i != null) lines[i].classList.add('looping');
  $('#bLoop').setAttribute('aria-pressed', i != null ? 'true' : 'false');
  $('#loopLbl').textContent = i != null ? 'Ulang 1 baris' : 'Ulang';
}

/* ---------- active line + scrolling ---------- */
function findIdx(t) {
  let lo = 0, hi = DATA.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (DATA[mid].s <= t + 0.05) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
function scrollToLine(i, force) {
  const el = lines[i];
  if (!el || el.offsetParent === null) return;
  if (!force && performance.now() < userScrollUntil) return;
  const top = el.offsetTop - list.clientHeight / 2 + el.clientHeight / 2;
  list.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
}
function setActive(i, force) {
  if (activeIdx >= 0) lines[activeIdx].classList.remove('active');
  activeIdx = i;
  if (i >= 0) { lines[i].classList.add('active'); scrollToLine(i, force); }
  updatePinUI();
}

/* ---------- main tick ---------- */
function updatePlayBtn() {
  const p = isPlaying();
  if (p === shownPlaying) return;
  shownPlaying = p;
  $('#bPlay').innerHTML = p ? pauseSvg : playSvg;
  $('#bPlay').setAttribute('aria-label', p ? 'Jeda' : 'Play');
}
function tick() {
  const nowMs = performance.now();
  if (!ytMode()) {
    if (clock.playing) {
      clock.t += ((nowMs - clock.last) / 1000) * rate;
      if (clock.t >= dur()) { clock.t = dur(); clock.playing = false; }
    }
    clock.last = nowMs;
  }
  const t = time();
  if (loopIdx != null && isPlaying() && t >= DATA[loopIdx].le - 0.05 && nowMs - lastLoopSeek > 500) {
    lastLoopSeek = nowMs;
    seek(DATA[loopIdx].s);
  }
  if (!dragging) {
    const i = nowMs < holdUntil ? activeIdx : findIdx(t);
    if (i !== activeIdx) setActive(i);
    seekEl.value = t;
    tcur.textContent = fmt(t);
  }
  if (!ytMode()) {
    $('#bigtime').textContent = fmt(t);
    const sec = Math.floor(t);
    if (sec !== lastLinkSec) { lastLinkSec = sec; $('#ytlink').href = 'https://youtu.be/' + VIDEO_ID + '?t=' + sec; $('#ytlink').textContent = 'Buka video di ' + fmt(t); }
  }
  updatePlayBtn();
}
setInterval(tick, 80);

/* ---------- events ---------- */
list.addEventListener('click', (e) => {
  const ln = e.target.closest('.line');
  if (!ln) return;
  const i = +ln.dataset.i;
  if (e.target.closest('.pinb')) { togglePin(i); return; }
  if (loopIdx != null) setLoop(i);
  seek(DATA[i].s);
  setActive(i, true);
  play();
});
list.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('line')) { e.preventDefault(); e.target.click(); }
});
['wheel', 'touchstart', 'pointerdown'].forEach((ev) => list.addEventListener(ev, () => { userScrollUntil = performance.now() + 4000; }, { passive: true }));

seekEl.addEventListener('input', () => {
  dragging = true;
  const v = parseFloat(seekEl.value);
  tcur.textContent = fmt(v);
  const i = findIdx(v);
  if (i !== activeIdx) setActive(i, true);
});
seekEl.addEventListener('change', () => {
  const v = parseFloat(seekEl.value);
  dragging = false;
  if (loopIdx != null && (v < DATA[loopIdx].s - 0.5 || v > DATA[loopIdx].le + 0.5)) setLoop(null);
  seek(v);
});

$('#bPlay').addEventListener('click', () => { if (isPlaying()) pause(); else play(); });
$('#bLoop').addEventListener('click', () => { if (loopIdx != null) setLoop(null); else setLoop(Math.max(activeIdx, 0)); });
$('#bPin').addEventListener('click', () => togglePin(Math.max(activeIdx, 0)));
$('#bIpa').addEventListener('click', () => {
  const off = app.classList.toggle('noipa');
  $('#bIpa').setAttribute('aria-pressed', String(!off));
  try { localStorage.setItem('uk-ipa', off ? '0' : '1'); } catch (e) {}
});
$('#bOnlyPins').addEventListener('click', () => {
  const on = app.classList.toggle('only-pinned');
  $('#bOnlyPins').setAttribute('aria-pressed', String(on));
  updatePinUI();
  if (activeIdx >= 0 && !on) scrollToLine(activeIdx, true);
});

RATES.forEach((r) => {
  const b = document.createElement('button');
  b.dataset.r = r; b.textContent = r + '×';
  b.addEventListener('click', () => { setRate(r); pop.hidden = true; });
  pop.appendChild(b);
});
$('#bSpeed').addEventListener('click', (e) => { e.stopPropagation(); pop.hidden = !pop.hidden; });
document.addEventListener('click', (e) => { if (!pop.hidden && !e.target.closest('#pop')) pop.hidden = true; });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' && !e.target.classList.contains('line') && e.target.tagName !== 'BUTTON') { e.preventDefault(); $('#bPlay').click(); }
});

/* ---------- start ---------- */
seekEl.max = DUR_DEFAULT; tdur.textContent = fmt(DUR_DEFAULT);
setRate(1); updatePinUI(); updatePlayBtn();
loadYouTube();
</script>

</body>
</html>
