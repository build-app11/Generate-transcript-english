<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jalur belajar · Learning Fun</title>
<script>try{var t=JSON.parse(localStorage.getItem('lf:theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--bg:#EEF2FF;--surface:#FFFFFF;--ink:#14162B;--on:#14162B;--muted:#4F5575;--line:#14162B;--shadow:#14162B;--rule:#D3D9F2;--yellow:#FFD23F;--coral:#FF6B5E;--blue:#4C84FF;--mint:#2ED3A0;--purple:#A07CFA;--font:'Albert Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--font-display:'Fredoka','Albert Sans',system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101226;--surface:#1B1E3A;--ink:#F2F3FF;--muted:#A9AED6;--line:#7A80C4;--shadow:#04050E;--rule:#2A2F55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101226;--surface:#1B1E3A;--ink:#F2F3FF;--muted:#A9AED6;--line:#7A80C4;--shadow:#04050E;--rule:#2A2F55;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
button,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:2.5px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font:600 1.3rem/1.1 var(--font-display);margin:0 auto 0 0}
.back{text-decoration:none;font:700 1.4rem/1 var(--font-display);padding:2px 8px}
.chip,.btn{border:2.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-family:var(--font-display);font-weight:600;cursor:pointer;text-decoration:none}
.chip{padding:4px 14px;box-shadow:3px 3px 0 var(--shadow)}
.chip.fire{background:var(--yellow);color:var(--on)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px;padding:11px 22px;box-shadow:3px 3px 0 var(--shadow)}
.btn:active,.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.pri{background:var(--yellow);color:var(--on)}
main{max-width:520px;margin:0 auto;padding:0 16px 56px}
.unit{margin-top:20px;padding:16px 20px;border:2.5px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);background:var(--c);color:var(--on)}
.unit b{display:block;font:700 1.6rem/1.15 var(--font-display)}
.c-purple{--c:var(--purple)}.c-blue{--c:var(--blue)}.c-coral{--c:var(--coral)}.c-mint{--c:var(--mint)}
.trail{position:relative;margin:0 -16px}
.trail svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail path{fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;opacity:.55}
.nw{position:absolute;width:88px;height:76px;transform:translate(-50%,-50%)}
.node{position:relative;width:88px;height:76px;display:grid;place-items:center;border:2.5px solid var(--line);border-radius:50%/48%;background:var(--surface);color:var(--ink);font:600 1.7rem var(--font-display);box-shadow:0 7px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--shadow)}
.node.cur{background:var(--yellow);color:var(--on)}
.node.done{background:var(--mint);color:var(--on)}
.node.lock{background:var(--rule);color:var(--muted);cursor:not-allowed;opacity:.85}
.tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);padding:1px 14px;border:2.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 1rem var(--font-display);white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.lbl{position:absolute;left:50%;top:calc(100% + 16px);transform:translateX(-50%);width:150px;text-align:center;font-size:.85rem;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
.msg{padding:56px 12px;text-align:center;color:var(--muted)}
dialog{border:2.5px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:22px;width:min(92vw,380px);box-shadow:6px 6px 0 var(--shadow)}
dialog::backdrop{background:rgba(20,22,43,.55)}
dialog h2{font:600 1.4rem/1.2 var(--font-display);margin:0 0 6px}
.meta{margin:0 0 14px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;margin:14px 0 4px}
.row input{width:20px;height:20px;accent-color:var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:10px 18px;border:2.5px solid var(--line);border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:3px 3px 0 var(--shadow)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="back" href="./" aria-label="Kembali ke daftar latihan">←</a>
  <h1>Jalur belajar</h1>
  <span class="chip fire" id="streak" title="Hari berturut-turut berlatih">🔥 0</span>
  <button class="chip" id="menuBtn">Progres</button>
</div></header>

<main id="path"><p class="msg">Memuat jalur…</p></main>

<dialog id="sheet"></dialog>

<dialog id="menu">
  <h2>Progres belajar</h2>
  <p class="meta">Tersimpan di browser ini. Ekspor untuk memindahkannya ke perangkat lain.</p>
  <button class="btn pri" data-a="exp">Ekspor progres</button>
  <button class="btn" data-a="imp">Impor progres</button>
  <label class="row"><input type="checkbox" id="strict"> Kunci latihan secara berurutan</label>
  <button class="btn" data-a="rst">Reset progres</button>
  <button class="btn" data-a="close">Tutup</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
</dialog>
<div id="toast" role="status" hidden></div>

<script>
(() => {
  const CFG = {
    index: 'data/index.json',
    viewer: 'player-video.html',        // ?q=slug
    audioViewer: 'player-audio.html',   // ?q=slug (pelajaran yang punya kolom "audio")
    perUnit: 5,                         // jumlah latihan per unit
    key: 'lf:path',                     // progres
    pending: 'lf:path:pending'          // latihan yang baru dibuka
  };
  const COL = ['purple', 'blue', 'coral', 'mint'], ROW = 150;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('Penyimpanan browser tidak tersedia'); } }
  };
  const day = d => d.toLocaleDateString('sv');
  const isAudio = l => !!l.audio;
  const href = l => (isAudio(l) ? CFG.audioViewer : CFG.viewer) + '?q=' + encodeURIComponent(l.slug);

  let L = [], S = load(), first = true;
  function load() {
    const s = store.get(CFG.key);
    return { done: (s && typeof s.done === 'object' && s.done) || {}, strict: !s || s.strict !== false };
  }
  const save = () => store.set(CFG.key, S);

  function toast(t) {
    const e = $('#toast'); e.textContent = t; e.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => e.hidden = true, 2400);
  }
  function streak() {
    const d = new Set(Object.values(S.done).map(v => day(new Date(v.at || 0))));
    let c = new Date(), n = 0;
    if (!d.has(day(c))) c = new Date(Date.now() - 864e5);
    while (d.has(day(c))) { n++; c = new Date(c - 864e5); }
    return n;
  }

  function render() {
    $('#streak').textContent = '🔥 ' + streak();
    const el = $('#path');
    if (!L.length) { el.innerHTML = '<p class="msg">Belum ada latihan di data/index.json.</p>'; return; }
    const cur = L.findIndex(l => !S.done[l.slug]), per = CFG.perUnit;
    let h = '';
    for (let u = 0; u * per < L.length; u++) {
      const items = L.slice(u * per, u * per + per);
      const n = items.filter(l => S.done[l.slug]).length;
      h += `<section class="unit c-${COL[u % COL.length]}"><b>Unit ${u + 1}</b>${n} dari ${items.length} latihan selesai</section><div class="trail"><svg aria-hidden="true"></svg>`;
      items.forEach((l, k) => {
        const i = u * per + k, done = !!S.done[l.slug];
        const st = done ? 'done' : i === cur ? 'cur' : S.strict ? 'lock' : '';
        h += `<div class="nw"><button class="node ${st}" data-i="${i}" aria-label="${esc(l.title)}">${done ? '✓' : isAudio(l) ? '♪' : '▶'}${i === cur ? '<span class="tip">Mulai</span>' : ''}</button><div class="lbl">${esc(l.title)}</div></div>`;
      });
      h += '</div>';
    }
    el.innerHTML = h;
    layout();
    const c = $('.node.cur');
    if (c && first) { first = false; c.scrollIntoView({ block: 'center' }); }
  }

  function layout() {
    document.querySelectorAll('.trail').forEach(t => {
      const W = t.clientWidth, nodes = [...t.querySelectorAll('.nw')], amp = Math.min(80, W / 2 - 100);
      const pts = nodes.map((n, k) => {
        const x = Math.round(W / 2 + Math.sin(k * 1.1) * amp), y = k * ROW + 70;
        n.style.left = x + 'px'; n.style.top = y + 'px'; return [x, y];
      });
      t.style.height = nodes.length * ROW + 'px';
      let d = '';
      pts.forEach(([x, y], k) => {
        if (!k) { d += `M${x} ${y}`; return; }
        const [px, py] = pts[k - 1], my = (py + y) / 2;
        d += `C${px} ${my} ${x} ${my} ${x} ${y}`;
      });
      t.querySelector('svg').innerHTML = `<path d="${d}"/>`;
    });
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 100); });

  /* ---- sheet ---- */
  const sheet = h => { const d = $('#sheet'); d.innerHTML = h; if (!d.open) d.showModal(); };
  function openLesson(l) {
    const done = S.done[l.slug], s = esc(l.slug);
    sheet(`<h2>${esc(l.title)}</h2><p class="meta">${isAudio(l) ? 'Audio' : 'Video'} · ${l.lines || 0} baris${done ? ' · Selesai ✓' : ''}</p>
      <a class="btn pri" data-a="go" data-s="${s}" href="${esc(href(l))}">${done ? 'Latihan lagi' : 'Mulai latihan'}</a>
      <button class="btn" data-a="mark" data-s="${s}">${done ? 'Batalkan selesai' : 'Tandai selesai'}</button>
      <button class="btn" data-a="close">Tutup</button>`);
  }
  function checkPending() {
    const s = store.get(CFG.pending); if (!s) return;
    store.set(CFG.pending, null);
    const l = L.find(x => x.slug === s);
    if (!l || S.done[s]) return;
    sheet(`<h2>Sudah selesai berlatih?</h2><p class="meta">${esc(l.title)}</p>
      <button class="btn pri" data-a="yes" data-s="${esc(s)}">Ya, tandai selesai</button>
      <button class="btn" data-a="close">Belum</button>`);
  }
  const setDone = (slug, on) => { if (on) S.done[slug] = { at: Date.now() }; else delete S.done[slug]; save(); render(); };

  $('#path').addEventListener('click', e => {
    const b = e.target.closest('.node'); if (!b) return;
    if (b.classList.contains('lock')) return toast('Selesaikan latihan sebelumnya dulu');
    openLesson(L[+b.dataset.i]);
  });
  $('#sheet').addEventListener('click', e => {
    if (e.target.id === 'sheet') return e.target.close();
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, s = b.dataset.s;
    if (a === 'go') store.set(CFG.pending, s);
    else if (a === 'mark') { setDone(s, !S.done[s]); $('#sheet').close(); }
    else if (a === 'yes') { setDone(s, true); $('#sheet').close(); toast('Latihan selesai ✓'); }
    else if (a === 'close') $('#sheet').close();
  });

  /* ---- menu: ekspor / impor ---- */
  const menu = $('#menu');
  $('#menuBtn').onclick = () => { $('#strict').checked = S.strict; menu.showModal(); };
  $('#strict').onchange = e => { S.strict = e.target.checked; save(); render(); };
  menu.addEventListener('click', e => {
    if (e.target === menu) return menu.close();
    const a = e.target.closest('[data-a]')?.dataset.a;
    if (a === 'close') menu.close();
    if (a === 'imp') $('#file').click();
    if (a === 'exp') {
      const out = { app: 'learningfun-path', version: 1, exportedAt: new Date().toISOString(), progress: { done: S.done } };
      const el = document.createElement('a');
      el.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
      el.download = 'jalur-belajar-' + day(new Date()) + '.json'; el.click();
      setTimeout(() => URL.revokeObjectURL(el.href), 1000);
      menu.close(); toast('Progres diekspor');
    }
    if (a === 'rst' && confirm('Hapus semua progres di perangkat ini?')) {
      S.done = {}; save(); render(); menu.close(); toast('Progres direset');
    }
  });
  $('#file').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const j = JSON.parse(await f.text()), d = j.progress?.done;
      if (j.app !== 'learningfun-path' || !d || typeof d !== 'object') throw 0;
      let added = 0;
      for (const [slug, v] of Object.entries(d)) {
        const m = S.done[slug];
        if (!m) { S.done[slug] = { at: v.at || Date.now() }; added++; }
        else m.at = Math.max(m.at || 0, v.at || 0);
      }
      save(); render(); menu.close(); toast(`Impor berhasil: ${added} latihan baru`);
    } catch { toast('File progres tidak valid'); }
  };

  /* ---- mulai ---- */
  async function init() {
    try {
      const r = await fetch(CFG.index); if (!r.ok) throw 0;
      const j = await r.json();
      L = (Array.isArray(j) ? j : j.lessons || []).filter(l => l && l.slug);
      render(); checkPending();
    } catch {
      $('#path').innerHTML = `<p class="msg">Tidak bisa memuat ${esc(CFG.index)}.<br>Buka lewat server (bukan file langsung).</p>`;
    }
  }
  addEventListener('pageshow', e => { if (e.persisted && L.length) { S = load(); render(); checkPending(); } });
  init();
})();
</script>
</body>
</html>
