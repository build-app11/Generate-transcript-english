<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shadowing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&family=DM+Mono:wght@400;500&family=Gentium+Plus:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: one-screen practice app. Player/timer strip on top, transcript scrolls in the middle, control dock pinned at the bottom. Active line is tinted, its time chip turns red like a Tube line marker. */
:root {
  --bg: #EEF2FF;
  --surface: #FFFFFF;
  --ink: #14162B;
  --muted: #4F5575;
  --rule: #D3D9F2;
  --accent: #FFD23F;
  --accent-ink: #14162B;
  --tint: #FFF1B8;
  --ipa: #1F5FB8;
  --font-en: 'Albert Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-ipa: 'Gentium Plus', 'Charis SIL', 'Noto Serif', 'DejaVu Serif', serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  --fs: 1;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101226; --surface: #1B1E3A; --ink: #F2F3FF; --muted: #A9AED6; --rule: #2A2F55;
    --accent: #FFD23F; --accent-ink: #14162B; --tint: #3B3416; --ipa: #8DB8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101226; --surface: #1B1E3A; --ink: #F2F3FF; --muted: #A9AED6; --rule: #2A2F55;
  --accent: #FFD23F; --accent-ink: #14162B; --tint: #3B3416; --ipa: #8DB8FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-en); font-size: 16px; line-height: 1.35; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }

.app { height: 100%; max-width: none; margin: 0 auto; position: relative; --gx: clamp(12px, 3vw, 32px); padding-inline: var(--gx); padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.side { display: contents; }
.stage { order: 1; }
.list { order: 2; }
.dock { order: 3; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1.cut { cursor: pointer; }
.top h1.open { white-space: normal; overflow: visible; text-overflow: clip; text-wrap: balance; }
.top .sub { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); }
.chips { display: flex; gap: 8px; align-items: center; }
.chip { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* stage */
.stage { flex: none; }
.ytbox { aspect-ratio: 16 / 9; width: min(100%, max(260px, calc((100vh - 320px) * 16 / 9))); width: min(100%, max(260px, calc((100dvh - 320px) * 16 / 9))); margin-inline: auto; background: #000; border-radius: 18px; overflow: hidden; }
.ytbox iframe { width: 100%; height: 100%; display: block; }
.timerbox { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; }
.timerbox .big { font-family: var(--font-mono); font-size: 1.9rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.timerbox p { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 0.82rem; color: var(--muted); }
.timerbox a { min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 0.82rem; font-weight: 600; text-decoration: none; }

/* transcript */
.list { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 2px; padding-block: 2px 168px; scrollbar-width: thin; }
.line { display: flex; align-items: flex-start; gap: 12px; padding: 14px 12px; border-radius: 20px; cursor: pointer; }
.line:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.line .tm { flex: none; width: 44px; margin-top: 3px; padding: 2px 0; text-align: center; border-radius: 6px; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.line .body { flex: 1; min-width: 0; }
.ws { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.w { display: flex; flex-direction: column; }
.w b { font-weight: 600; font-size: calc(clamp(1.2rem, 1.05rem + 0.9vw, 1.7rem) * var(--fs, 1)); letter-spacing: -0.005em; }
.w i { font-family: var(--font-ipa); font-style: normal; font-size: calc(clamp(1rem, 0.9rem + 0.6vw, 1.3rem) * var(--fs, 1)); color: var(--ipa); line-height: 1.25; }
.line.music .w b { font-weight: 400; font-style: italic; color: var(--muted); }
.line.music { opacity: 0.7; }
.pinb { flex: none; width: 36px; height: 36px; margin: -4px -4px 0 0; display: grid; place-items: center; color: var(--muted); opacity: 0; border-radius: 10px; }
.line:hover .pinb, .line.pinned .pinb { opacity: 1; }
@media (hover: none) { .pinb { opacity: 0.45; } .line.pinned .pinb { opacity: 1; } }
.line.pinned .pinb { color: var(--accent-text); }
.line.pinned .pinb svg { fill: currentColor; }
.line.active { background: var(--tint); }
.line.active .tm { background: var(--accent); color: var(--accent-ink); }
.line.looping { box-shadow: inset 0 0 0 2px var(--accent); }

.line.looping .tm::after { content: ' ↻'; }
.noipa .w i { display: none; }
.only-pinned .line:not(.pinned) { display: none; }
.empty { padding: 28px 12px; color: var(--muted); font-size: 0.9rem; text-align: center; }
.empty[hidden] { display: none; }

/* dock */
.dock { position: absolute; left: var(--gx); right: var(--gx); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 3; flex: none; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16); border: 1px solid var(--rule); border-radius: 22px; padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.seek { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.seek input { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; }
.btns { display: flex; align-items: center; gap: 2px; }
.tool { flex: 1; min-width: 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.72rem; font-weight: 600; color: var(--muted); border-radius: 12px; }
.tool svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool .glyph { font-family: var(--font-ipa); font-size: 1.35rem; line-height: 22px; height: 22px; }
.tool[aria-pressed="true"] { color: var(--accent-text); }
.play { flex: none; width: 62px; height: 52px; margin-left: 4px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.play svg { width: 26px; height: 26px; fill: currentColor; stroke: none; }
.pop { position: absolute; right: 78px; bottom: calc(100% - 6px); display: flex; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); }
.pop[hidden] { display: none; }
.pop button { min-width: 48px; min-height: 40px; padding: 0 8px; border-radius: 10px; font-family: var(--font-mono); font-size: 0.82rem; border: 1px solid var(--rule); }
.pop button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.vpop { flex-direction: column; align-items: stretch; gap: 8px; min-width: min(280px, calc(100vw - 16px)); padding: 10px; }
.vpop #bIpa { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-en); font-weight: 600; font-size: 0.85rem; }
.vpop #bIpa .g { font-family: var(--font-ipa); font-size: 1.2rem; }
.vpop .szrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
.vpop .szslide { display: flex; align-items: center; gap: 8px; }
.vpop .szslide input { flex: 1; min-width: 0; height: 28px; accent-color: var(--accent); }
.vpop .szslide button, .vpop .szrow button { min-width: 44px; }
.vpop button:disabled { opacity: 0.35; cursor: not-allowed; }
.tool .aa { font-weight: 700; font-size: 1.15rem; line-height: 22px; height: 22px; letter-spacing: -0.02em; }
@media (max-width: 420px) {
  .pop { right: 8px; }
}
/* Laptop and desktop (also phones in desktop mode): one column. Large video on top, transcript under it, controls in one row pinned to the bottom edge. */
@media (min-width: 900px) {
  .app { max-width: 1120px; overflow-y: auto; scrollbar-width: thin; }
  .ytbox { width: min(100%, calc(clamp(240px, calc(100vh - 370px), 680px) * 16 / 9)); }
  .list { flex: 1 1 auto; min-height: 200px; padding-bottom: 24px; }
  .dock { position: sticky; left: auto; right: auto; box-shadow: none; bottom: 0; z-index: 3; flex-direction: row; align-items: center; gap: 20px; padding: 8px 16px; }
  .seek { flex: 1 1 auto; min-width: 0; }
  .btns { flex: none; gap: 4px; }
  .tool { flex: none; min-width: 66px; min-height: 48px; padding-inline: 6px; }
  .play { height: 48px; }
  .pop { right: 100px; }
  .line { padding: 14px 16px; }
  .line .tm { width: 52px; font-size: 0.78rem; }
}
/* Short landscape phones: two columns so the controls still fit. */
@media (orientation: landscape) and (min-width: 560px) and (max-height: 540px) {
  .app { max-width: 1280px; overflow: visible; display: grid; grid-template-columns: clamp(300px, 38%, 480px) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: clamp(16px, 2.4vw, 36px); row-gap: 12px; }
  .top { grid-column: 1 / -1; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; grid-column: 1; grid-row: 2; scrollbar-width: thin; padding-bottom: 2px; }
  .side > * { flex: none; }
  .list { grid-column: 2; grid-row: 2; min-height: 0; padding-bottom: 24px; }
  .dock { position: static; box-shadow: none; }
  .ytbox { width: min(100%, max(220px, calc((100vh - 230px) * 16 / 9))); }
}

/* kamus: klik kata untuk melihat arti */
.w { cursor: pointer; border-radius: 6px; -webkit-tap-highlight-color: transparent; }
.w:hover b { text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.w.sel b { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.line.music .w { cursor: default; }
/* popup arti kata: sama dengan Sync Reader (garis tebal, bayangan keras, kotak ARTI, tab EN / Terjemah) */
.dp { position: fixed; left: 12px; right: 12px; bottom: 170px; max-width: 34rem; margin: 0 auto; height: min(44vh, 28rem); z-index: 20; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); border: 2.5px solid var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--shadow); overflow: hidden; font-family: var(--font-en); }
.dp[hidden] { display: none; }
.dph { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px; flex: none; }
.dpw { flex: 1; min-width: 0; }
.dwd { display: block; font: 700 1.55rem/1.2 var(--font-en); color: var(--ink); overflow-wrap: anywhere; }
.dip { display: block; font: 400 1.05rem/1.4 var(--font-ipa); color: var(--accent-text); overflow-wrap: anywhere; }
.dpb { flex: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; border: 2.5px solid var(--line); background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; box-shadow: 2px 2px 0 var(--shadow); }
.dpb.alt { background: var(--surface); color: var(--ink); }
.dpb svg { width: 20px; height: 20px; }
.dpb:focus-visible, .dtab:focus-visible { outline: 3px solid var(--line); outline-offset: 2px; }
.dpbody { flex: 1; min-height: 0; overflow: auto; padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.dpid { background: var(--tint); border-radius: 12px; padding: 10px 14px; font-size: 0.92rem; line-height: 1.5; color: var(--ink); }
.dpid small { display: block; font: 600 0.7rem var(--font-en); letter-spacing: 0.14em; color: var(--accent-text); margin-bottom: 2px; }
.dtabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--rule); flex: none; }
.dtab { flex: 1; border: 0; border-radius: 9px; padding: 9px 6px; font: 700 0.9rem var(--font-en); background: transparent; color: var(--muted); cursor: pointer; }
.dtab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.dlist { display: flex; flex-direction: column; gap: 12px; }
.dp .dpos { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.dp .dpos b { font: 600 0.85rem var(--font-mono); background: var(--rule); color: var(--ink); border-radius: 999px; padding: 3px 10px; }
.dp .dpos span { font-size: 0.82rem; color: var(--muted); }
.dsn { display: flex; gap: 10px; align-items: flex-start; }
.kn { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--rule); color: var(--muted); font: 600 0.75rem var(--font-en); display: grid; place-items: center; margin-top: 3px; }
.dsb { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.dtx { font-size: 1rem; line-height: 1.5; }
.den { font-size: 0.82rem; color: var(--muted); line-height: 1.4; }
.dex { border-left: 3px solid var(--accent); padding-left: 10px; font-style: italic; color: var(--muted); font-size: 0.92rem; line-height: 1.45; }
.kmsg { color: var(--muted); font-size: 0.92rem; line-height: 1.5; }
.dfoot { flex: none; border-top: 1px solid var(--rule); padding: 8px 14px; font-size: 0.8rem; color: var(--muted); }
.dfoot a { color: var(--accent-text); }
.dsel { width: 100%; flex: none; font: 600 0.9rem var(--font-en); padding: 9px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

:root { --ok: #1B7F4B; --bad: #C0261D; --warn: #94600A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #4CC38A; --bad: #FF6B60; --warn: #E3A441; } }
:root[data-theme="dark"] { --ok: #4CC38A; --bad: #FF6B60; --warn: #E3A441; }

.chips { flex-wrap: wrap; }
.chip { min-height: 32px; padding: 0 11px; font-size: 0.78rem; }
.chip:disabled { opacity: 0.4; cursor: not-allowed; }
.ttlwrap { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 240px; }
.ttlwrap > div { min-width: 0; flex: 1; }
.hback { display: grid; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--rule); color: var(--ink); place-items: center; text-decoration: none; }
.hback svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; }
.seg button { min-height: 26px; padding: 0 11px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* grup Practice: satu tombol, tiga pilihan */
.pwrap { position: relative; }
.pwrap:has(.pitem[aria-pressed="true"]) > #bPractice { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 25; min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2); }
.pitem { min-height: 44px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.88rem; font-weight: 600; text-align: left; }
.pitem:hover:not(:disabled) { background: var(--bg); }
.pitem[aria-pressed="true"] { background: var(--tint); color: var(--accent-text); }
.pitem:disabled { opacity: 0.4; cursor: not-allowed; }

/* mode audio: video disembunyikan tapi tetap berjalan, transkrip naik ke atas */
.app.audio .ytbox { position: fixed; left: -400px; top: 0; width: 320px; height: 180px; aspect-ratio: auto; margin: 0; opacity: 0; pointer-events: none; }
.app.audio .stage { height: 0; margin-bottom: -10px; }

/* video bersih: hanya tombol play */
.ytbox { position: relative; }
.ytbox iframe { pointer-events: none; }
.ytov { position: absolute; inset: 0; z-index: 2; cursor: pointer; display: grid; place-items: center; background: rgba(0, 0, 0, 0.3); -webkit-tap-highlight-color: transparent; }
.ytov.playing { background: transparent; }
.ytov.playing .ytplay { display: none; }
.ytplay { width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; pointer-events: none; }
.ytplay svg { width: 30px; height: 30px; fill: currentColor; }

/* drill per baris: tombol mata di samping pin. Baris buram dan diulang; tahan untuk mengintip */
.drb { flex: none; width: 36px; height: 36px; margin: -4px 0 0 0; display: grid; place-items: center; color: var(--muted); opacity: 0; border-radius: 10px; }
.drb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.line:hover .drb, .line.drilled .drb { opacity: 1; }
@media (hover: none) { .drb { opacity: 0.45; } .line.drilled .drb { opacity: 1; } }
.line.drilled .drb { color: var(--accent-text); }
.line.drilled { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.line.drilled .body > .ws { filter: blur(9px); transition: filter 0.12s; }
.line.drilled.reveal .body > .ws { filter: none; }
.line.hasrec .tm::before { content: '\25CF'; display: block; font-size: 0.55rem; line-height: 1; color: var(--accent-text); }
.line.active.hasrec .tm::before { color: var(--accent-ink); }

/* shadowing otomatis: tiap baris bergilir (dengar, echo, rekam, putar) */
.line.sh-listen { box-shadow: inset 0 0 0 2px var(--rule); }
.line.sh-echo { box-shadow: inset 0 0 0 2px var(--warn); }
.line.sh-rec { box-shadow: inset 0 0 0 2px var(--accent); }
.line.sh-play { box-shadow: inset 0 0 0 2px var(--ok); }

/* dictation: satu kalimat per langkah, kotak per kata, Check lalu Next */
.dict { order: 2; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 168px; scrollbar-width: thin; }
.app.dictation .list { display: none; }
@media (min-width: 900px) { .dict { padding-bottom: 24px; min-height: 200px; } }
@media (orientation: landscape) and (min-width: 560px) and (max-height: 540px) { .dict { grid-column: 2; grid-row: 2; padding-bottom: 24px; } }
.dcard { display: flex; flex-direction: column; gap: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 20px; }
.dnav { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.dnav::-webkit-scrollbar { display: none; }
.dn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--rule); background: var(--bg); font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; }
.dn.cur { border-color: var(--warn); color: var(--warn); }
.dn.ok { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 60%, transparent); color: var(--ok); }
.dn.bad { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 60%, transparent); color: var(--bad); }
.dn.cur.ok, .dn.cur.bad { box-shadow: 0 0 0 2px var(--warn); }
.dwords { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 12px 8px; padding: 6px 0; }
.dtk { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.dtk .row { display: flex; align-items: center; gap: 3px; }
.dpt { font-size: 1.15rem; font-weight: 600; color: var(--muted); }

<script>
/* KERANGKA KOSONG: data pelajaran dimuat dari file JSON.
   Alamat: player-video.html?q=nama-pelajaran  ->  data/nama-pelajaran.json */
let VIDEO_ID = '', JUDUL = '', TRANSKRIP = '';
(function () {
  var DIR = 'data/';
  var $b = function (id) { return document.getElementById(id); };
  var ready = function (fn) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn(); };
  var two = function (n) { return (n < 10 ? '0' : '') + n; };
  var stamp = function (sec) { var s = Math.floor(sec); return '[' + two(Math.floor(s / 3600)) + ':' + two(Math.floor((s % 3600) / 60)) + ':' + two(s % 60) + ']'; };
  function convert(j) {
    if (!j || !Array.isArray(j.lines) || !j.lines.length) throw new Error('JSON tidak berisi baris transkrip.');
    var out = [];
    j.lines.forEach(function (l) {
      if (!l || typeof l.text !== 'string' || !isFinite(l.start) || l.start < 0) return;
      var ts = stamp(l.start);
      out.push(ts + ' ' + l.text.replace(/[\r\n]+/g, ' '), ts + ' ' + String(l.ipa == null ? '' : l.ipa).replace(/[\r\n]+/g, ' '));
    });
    if (!out.length) throw new Error('Tidak ada baris yang valid di JSON.');
    return out.join('\n');
  }
  function show(title, msg, pick) { $b('bootT').className = 'err'; $b('bootT').textContent = title; $b('bootP').textContent = msg; $b('bootA').hidden = !pick; }
  function start(j) {
    TRANSKRIP = convert(j);
    VIDEO_ID = /^[\w-]{11}$/.test(j.videoId || '') ? j.videoId : '';
    JUDUL = String(j.title || 'Shadowing').slice(0, 200);
    if (typeof j.backUrl === 'string' && /^https?:\/\//i.test(j.backUrl)) {
      var hb = $b('hback'); if (hb) hb.href = j.backUrl;
    }
    [['category', j.category], ['keywords', Array.isArray(j.tags) ? j.tags.join(', ') : '']].forEach(function (p) {
      if (!p[1]) return;
      var mt = document.createElement('meta'); mt.name = p[0]; mt.content = String(p[1]).slice(0, 300); document.head.appendChild(mt);
    });
    var yl = $b('ytlink'); if (yl) yl.href = 'https://youtu.be/' + VIDEO_ID;
    var s = document.createElement('script');
    s.textContent = $b('appjs').textContent;
    document.body.appendChild(s);
    var bt = $b('boot'); if (bt) bt.remove();
  }
  function fromText(txt) {
    var j;
    try { j = JSON.parse(txt); } catch (e) { show('File bukan JSON yang valid', 'Pakai file JSON hasil ekspor dari generator.', true); return; }
    try { start(j); } catch (e) { show('JSON tidak bisa dipakai', e.message, true); }
  }
  ready(function () {
    $b('bootFile').addEventListener('change', function () { var f = this.files[0]; if (f) f.text().then(fromText); });
    var sp = new URLSearchParams(location.search), v = sp.get('q') || sp.get('v');
    if (!v) { show('Pilih pelajaran', 'Buka halaman ini dengan alamat ...?q=nama-pelajaran, atau pilih file JSON dari perangkatmu.', true); return; }
    if (v.indexOf('..') >= 0 || !/^[A-Za-z0-9_][A-Za-z0-9_.\-]*(\/[A-Za-z0-9_][A-Za-z0-9_.\-]*)*$/.test(v)) {
      show('Nama pelajaran tidak valid', 'Pakai huruf, angka, tanda minus, atau garis bawah.', true); return;
    }
    var url = DIR + (/\.json$/i.test(v) ? v : v + '.json');
    fetch(url, { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(fromText)
      .catch(function () {
        show('Pelajaran tidak ditemukan', location.protocol === 'file:'
          ? 'Browser memblokir pembacaan JSON dari file lokal. Pilih file JSON secara manual, atau buka halaman lewat alamat web.'
          : 'File ' + url + ' tidak bisa dimuat. Periksa nama dan lokasinya.', true);
      });
  });
})();

</script>

<script type="text/plain" id="appjs">

function parseTranskrip(raw) {
  const ent = [];
  raw.split(/\r?\n/).forEach((l) => {
    let m = l.match(/^\s*\[(\d{1,2}):(\d{2}):(\d{2})\]\s*(.*)$/);
    if (m) { ent.push([+m[1] * 3600 + +m[2] * 60 + +m[3], m[4].trim()]); return; }
    m = l.match(/^\s*\[(\d{1,3}):(\d{2})\]\s*(.*)$/);
    if (m) ent.push([+m[1] * 60 + +m[2], m[3].trim()]);
  });
  const tidy = (s) => s.replace(/"\s+(\S)/g, '"$1').replace(/\s+([.,?!])/g, '$1').replace(/ - /g, '-').replace(/\s+/g, ' ').trim();
  const out = [];
  let prev = -1, i = 0;
  while (i < ent.length - 1) {
    if (ent[i][0] !== ent[i + 1][0]) { i += 1; continue; }
    let t = ent[i][0];
    const en = tidy(ent[i][1]), ip = tidy(ent[i + 1][1]);
    i += 2;
    if (t <= prev) t = Math.round((prev + 0.6) * 100) / 100;
    prev = t;
    const a = en.split(' '), b = ip.split(' ');
    const d = { t, en, ip };
    if (a.length === b.length) d.w = a.map((x, k) => [x, b[k]]);
    if (/^\[\s*music\s*\]/i.test(en)) d.m = 1;
    out.push(d);
  }
  return out;
}
const DATA = parseTranskrip(TRANSKRIP);
document.title = JUDUL;
const titleEl = document.getElementById('ttl');
if (titleEl) titleEl.textContent = JUDUL;
if (titleEl) {
  const chk = () => { if (!titleEl.classList.contains('open')) titleEl.classList.toggle('cut', titleEl.scrollWidth > titleEl.clientWidth + 1); };
  titleEl.addEventListener('click', () => {
    if (titleEl.classList.contains('open')) { titleEl.classList.remove('open'); chk(); }
    else if (titleEl.classList.contains('cut')) titleEl.classList.add('open');
  });
  window.addEventListener('resize', chk);
  window.addEventListener('load', chk);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(chk);
  chk();
}
if (!DATA.length) {
  document.getElementById('list').innerHTML = '<div class="empty">Transkrip kosong atau formatnya tidak dikenali. Pastikan setiap baris diawali [00:00:17] dan berpasangan: teks Inggris lalu IPA.</div>';
  throw new Error('Transkrip kosong');
}
const RATES = [0.5, 0.75, 1, 1.25, 1.5];
const $ = (s) => document.querySelector(s);
const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* segment ends: highlight runs until the next line, a loop stops a little after the speech ends */
DATA.forEach((d, i) => {
  const next = i < DATA.length - 1 ? DATA[i + 1].t : d.t + 5;
  const words = d.w ? d.w.length : 3;
  d.s = d.t;
  d.le = Math.min(next, d.t + Math.max(2.2, words * 0.55 + 1.3));
});
const DUR_DEFAULT = Math.ceil(DATA[DATA.length - 1].t + 8);

const list = $('#list'), seekEl = $('#seek'), tcur = $('#tcur'), tdur = $('#tdur');
const app = $('#app'), pop = $('#pop'), vpop = $('#vpop');
const playSvg = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const pauseSvg = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const pinSvg = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6zM12 14v7"/></svg>';

let mode = 'timer', yt = null, ytOk = false;
const clock = { t: 0, playing: false, last: 0 };
let drillIdx = null;
let loopMax = 0, loopCap = 0, loopDone = 0;
try { const lm = +localStorage.getItem('uk-loopmax'); if (lm >= 1 && lm <= 3) loopMax = lm; } catch (e) {}
let rate = 1, loopIdx = null, activeIdx = -1, dragging = false;
let userScrollUntil = 0, lastLoopSeek = 0, holdUntil = 0, shownPlaying = null, lastLinkSec = -1;
const PINKEY = 'uk-pins:' + VIDEO_ID;
let pins = new Set();
try { pins = new Set(JSON.parse(localStorage.getItem(PINKEY) || '[]')); } catch (e) {}
try { if (localStorage.getItem('uk-ipa') === '0') { app.classList.add('noipa'); $('#bIpa').setAttribute('aria-pressed', 'false'); } } catch (e) {}

/* ---------- render ---------- */
const eyeSvg = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0112 6c5 0 8.5 4.5 9.5 6a15 15 0 01-3.2 3.7M6.5 7.6C4.4 9 2.9 11 2.5 12c1 1.5 4.5 6 9.5 6 1.5 0 2.8-.4 4-1M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
const lines = [];
DATA.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (d.m ? ' music' : '') + (pins.has(d.t) ? ' pinned' : '');
  el.dataset.i = i;
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  const body = d.w
    ? '<div class="ws">' + d.w.map(([a, b]) => '<span class="w"><b>' + esc(a) + '</b><i>' + esc(b) + '</i></span>').join('') + '</div>'
    : '<div class="ws"><span class="w"><b>' + esc(d.en) + '</b><i>' + esc(d.ip) + '</i></span></div>';
  const drb = d.m ? '' : '<button class="drb" aria-label="Drill baris: buram dan ulang" tabindex="-1">' + eyeSvg + '</button>';
  el.innerHTML = '<div class="body">' + body + '</div>' + drb + '<button class="pinb" aria-label="Simpan baris" tabindex="-1">' + pinSvg + '</button>';
  list.appendChild(el);
  lines.push(el);
});
const emptyEl = document.createElement('div');
emptyEl.className = 'empty'; emptyEl.hidden = true;
emptyEl.textContent = 'Belum ada baris tersimpan. Tekan ikon pin di sebuah baris untuk menyimpannya.';
list.appendChild(emptyEl);
$('#count').textContent = DATA.length;

function updatePinUI() {
  $('#pinCount').textContent = pins.size;
  const onlyPins = app.classList.contains('only-pinned');
  emptyEl.hidden = !(onlyPins && pins.size === 0);
  const cur = Math.max(activeIdx, 0);
  $('#bPin').setAttribute('aria-pressed', pins.has(DATA[cur].t) ? 'true' : 'false');
}
function togglePin(i) {
  const t = DATA[i].t;
  if (pins.has(t)) pins.delete(t); else pins.add(t);
  lines[i].classList.toggle('pinned', pins.has(t));
  try { localStorage.setItem(PINKEY, JSON.stringify([...pins])); } catch (e) {}
  updatePinUI();
}

/* ---------- player adapter: YouTube when it can load, timer otherwise ---------- */
const ytMode = () => mode === 'yt' && ytOk;
const dur = () => { if (ytMode()) { const d = yt.getDuration(); if (d > 0) return d; } return DUR_DEFAULT; };
const time = () => (ytMode() ? yt.getCurrentTime() : clock.t);
const isPlaying = () => (ytMode() ? yt.getPlayerState() === 1 : clock.playing);
function seek(t) {
  t = Math.min(Math.max(0, t), dur());
  holdUntil = performance.now() + 450;
  if (ytMode()) yt.seekTo(t, true); else clock.t = t;
}
function play() {
  if (ytMode()) yt.playVideo();
  else { if (clock.t >= dur() - 0.1) clock.t = 0; clock.playing = true; clock.last = performance.now(); }
}
function pause() { if (ytMode()) yt.pauseVideo(); else clock.playing = false; }
function setRate(r) {
  rate = r;
  if (ytMode()) yt.setPlaybackRate(r);
  $('#speedLbl').textContent = 'Speed ' + r + '×';
  [...pop.children].forEach((b) => b.setAttribute('aria-pressed', String(parseFloat(b.dataset.r) === r)));
}

function showTimer() {

  $('#ytbox').hidden = true; $('#timerbox').hidden = false;

  $('#ytbox').hidden = false; $('#timerbox').hidden = true;

  $('#seg').hidden = false; $('#bShadow').disabled = false; applyAV();
}
function loadYouTube() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => {};
  window.onYouTubeIframeAPIReady = () => {

  const b = e.target.closest('[data-d]'); if (!b) return; const a = b.dataset.d;
  if (a === 'x') closeTip();
  else if (a === 'en' || a === 'tr') kdTab(a);
  else if (a === 'say' && dSt && canSpeak) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(dSt.q); u.lang = 'en-GB'; u.rate = 0.9; speechSynthesis.speak(u); } catch (_) {} }
});
window.addEventListener('resize', placeDp);
document.addEventListener('click', (e) => { if (!e.target.closest('#dp') && !e.target.closest('.w')) closeTip(); });

/* ---------- status di header ---------- */
let baseLbl = 'mode timer', flash = '', flashT = null, shownKey = null;
const stopSvg = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const dictOn = () => app.classList.contains('dictation');

const SH_LBL = { listen: 'dengar', echo: 'echo', rec: 'merekam', play: 'memutar rekamanmu' };
function refreshStatus() {
  let s = baseLbl;
  if (flash) s = flash;
  else if (sh.on) s = 'shadowing · baris ' + (sh.idx + 1) + ' · ' + (SH_LBL[sh.state] || 'siap');
  else if (dictOn()) s = dictSummary();
  $('#modeLbl').textContent = s;
}
function flashStatus(msg) {
  clearTimeout(flashT); flash = msg || '';
  refreshStatus();
  if (msg) flashT = setTimeout(() => { flash = ''; refreshStatus(); }, 4000);
}

/* ---------- drill per baris: buram + diulang, tahan untuk mengintip ---------- */
function toggleDrill(i) {
  if (drillIdx === i) { setLoop(null); return; }
  if (sh.on) shStop();
  setLoop(i);
  drillIdx = i;
  lines[i].classList.add('drilled');
  seek(DATA[i].s); setActive(i, true); play();
}
let pressTimer = null, pressLine = null, pressX = 0, pressY = 0, justPeeked = false;
function endPeek() {
  clearTimeout(pressTimer); pressTimer = null;
  if (pressLine) { pressLine.classList.remove('reveal'); pressLine = null; }
}
list.addEventListener('pointerdown', (e) => {
  justPeeked = false;
  const ln = e.target.closest('.line');
  if (!ln || !ln.classList.contains('drilled') || e.target.closest('.pinb, .drb')) return;
  endPeek();
  pressX = e.clientX; pressY = e.clientY;
  pressTimer = setTimeout(() => { pressTimer = null; pressLine = ln; ln.classList.add('reveal'); justPeeked = true; closeTip(); }, 350);
});
list.addEventListener('pointermove', (e) => {
  if (pressTimer && Math.hypot(e.clientX - pressX, e.clientY - pressY) > 10) { clearTimeout(pressTimer); pressTimer = null; }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => list.addEventListener(ev, () => { if (pressLine || pressTimer) endPeek(); }));
list.addEventListener('contextmenu', (e) => { if (e.target.closest('.line.drilled')) e.preventDefault(); });
list.addEventListener('scroll', () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }, { passive: true });

/* ---------- opsi pengulangan: 1x, 2x, 3x atau tanpa batas ---------- */
const lpop = $('#lpop');
[[1, '1×'], [2, '2×'], [3, '3×'], [0, '∞']].forEach(([n, t]) => {

  b.dataset.n = n; b.textContent = t;
  b.setAttribute('aria-label', n ? 'Ulang ' + n + ' kali' : 'Ulang tanpa batas');
  b.addEventListener('click', () => {
    loopMax = n; lsSet('uk-loopmax', String(n)); syncLoopOpts(); lpop.hidden = true;
    if (sh.on) shStop();
    setLoop(Math.max(activeIdx, 0));
  });
  lpop.appendChild(b);
});
function syncLoopOpts() { [...lpop.children].forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === loopMax))); }
syncLoopOpts();
document.addEventListener('click', (e) => { if (!lpop.hidden && !e.target.closest('#lpop') && !e.target.closest('#bLoop')) lpop.hidden = true; });
['#bSpeed', '#bView'].forEach((q) => $(q).addEventListener('click', () => { lpop.hidden = true; }));

/* ---------- shadowing otomatis: dengar, echo, rekam (tombol Stop), putar langsung, lalu baris berikutnya ---------- */
const recs = new Map();
const sh = { on: false, starting: false, idx: 0, state: 'idle', tok: 0, t0: 0, seen: false, end: 0, echoStart: 0, echoDur: 0, stream: null, mime: '', mr: null, recTimer: null, aud: null, gapTimer: null };
const pinOnly = () => app.classList.contains('only-pinned') && pins.size > 0;
function shNext(from) {
  for (let j = Math.max(0, from); j < DATA.length; j++) {
    if (!DATA[j].m && (!pinOnly() || pins.has(DATA[j].t))) return j;
  }
  return -1;
}
function setShState(s) {
  const el = lines[sh.idx];
  if (el) {
    ['listen', 'echo', 'rec', 'play'].forEach((k) => el.classList.remove('sh-' + k));
    if (s !== 'idle') el.classList.add('sh-' + s);
  }
  sh.state = s;
  refreshStatus(); updatePlayBtn();
}
function shRun(from) {
  clearTimeout(sh.gapTimer); clearTimeout(sh.recTimer);
  if (sh.aud) { try { sh.aud.pause(); } catch (e) {} sh.aud = null; }
  sh.tok++;
  if (sh.mr && sh.mr.state !== 'inactive') { try { sh.mr.stop(); } catch (e) {} }
  setShState('idle');
  const j = shNext(from);
  if (j < 0) { shStop('shadowing selesai'); return; }
  sh.idx = j;
  const d = DATA[j];
  sh.end = Math.max(d.s + 0.5, d.le - 0.3);
  sh.t0 = performance.now(); sh.seen = false;
  setActive(j, true);
  setShState('listen');
  seek(d.s); play();
}
function shEcho() {
  const d = DATA[sh.idx];
  sh.echoStart = performance.now();
  sh.echoDur = Math.max(1500, ((d.le - d.s) / rate) * 1000 + 600);
  setShState('echo');
}
function shStopRec() {
  clearTimeout(sh.recTimer); sh.recTimer = null;
  if (sh.mr && sh.mr.state !== 'inactive') { try { sh.mr.stop(); } catch (e) {} }
}
function shRecord() {
  const i = sh.idx, tok = sh.tok;
  let mr;
  try { mr = new MediaRecorder(sh.stream, sh.mime ? { mimeType: sh.mime } : undefined); }
  catch (e) { shStop('rekam suara tidak didukung'); return; }
  const chunks = [];
  mr.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  mr.onstop = () => {
    clearTimeout(sh.recTimer); sh.recTimer = null;
    if (sh.mr === mr) sh.mr = null;
    if (!sh.on || tok !== sh.tok) return;
    if (!chunks.length) { shRun(sh.idx + 1); return; }
    const old = recs.get(i);
    if (old) URL.revokeObjectURL(old.url);
    const url = URL.createObjectURL(new Blob(chunks, { type: mr.mimeType || sh.mime || 'audio/webm' }));
    recs.set(i, { url });
    lines[i].classList.add('hasrec');
    shPlayback(url);
  };
  sh.mr = mr;
  mr.start();
  setShState('rec');
  const d = DATA[i];
  sh.recTimer = setTimeout(shStopRec, ((d.le - d.s) * 1.5 + 3) * 1000);
}
function shPlayback(url) {
  const tok = sh.tok;
  setShState('play');
  const a = new Audio(url);
  sh.aud = a;
  const done = () => { if (sh.aud === a && tok === sh.tok) { sh.aud = null; sh.gapTimer = setTimeout(() => shRun(sh.idx + 1), 400); } };
  a.onended = done; a.onerror = done;
  a.play().catch(done);
}
function shTick(nowMs, t) {
  if (!sh.on) return;
  if (sh.state === 'listen') {
    const d = DATA[sh.idx];
    if (nowMs > holdUntil && t >= d.s - 0.5 && t < sh.end) sh.seen = true;
    if ((sh.seen && t >= sh.end) || nowMs - sh.t0 > ((sh.end - d.s) / rate) * 1000 + 5000) { pause(); shEcho(); }
  } else if (sh.state === 'echo') {
    if ((nowMs - sh.echoStart) / sh.echoDur >= 1) shRecord();
  }
}
function shPress() {
  if (sh.state === 'rec') shStopRec(); else shStop('shadowing dihentikan');
}
function shStop(msg) {
  sh.on = false; sh.tok++;
  clearTimeout(sh.gapTimer); clearTimeout(sh.recTimer);
  if (sh.mr && sh.mr.state !== 'inactive') { try { sh.mr.stop(); } catch (e) {} }
  if (sh.aud) { try { sh.aud.pause(); } catch (e) {} sh.aud = null; }
  if (sh.stream) { sh.stream.getTracks().forEach((x) => x.stop()); sh.stream = null; }
  setShState('idle');
  pause();
  $('#bShadow').setAttribute('aria-pressed', 'false');
  shownKey = null; updatePlayBtn();
  flashStatus(msg);
}
async function shStart() {
  if (sh.starting) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { flashStatus('rekam suara tidak didukung di browser ini'); return; }
  sh.starting = true;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { sh.starting = false; flashStatus('mikrofon tidak diizinkan'); return; }
  sh.starting = false;
  if (dictOn()) setDict(false);
  setLoop(null);
  closeTip();
  sh.stream = stream;
  sh.mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find((m) => MediaRecorder.isTypeSupported(m)) || '';
  sh.on = true;
  $('#bShadow').setAttribute('aria-pressed', 'true');
  shownKey = null;
  shRun(Math.max(activeIdx, 0));
}
$('#bShadow').addEventListener('click', () => { if (sh.on) shStop('shadowing dimatikan'); else shStart(); });

/* ---------- dictation: satu kalimat per langkah, kotak per kata, Check lalu Next ---------- */
const dst = new Map();
let ditems = [], dpos = 0, dwords = [], dFin = false;
const normW = (s) => String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/'/g, '').replace(/[^\p{L}\p{N}\s]+/gu, ' ').split(/\s+/).filter(Boolean);
const ansOf = (s) => normW(s).join('');
function splitTok(tk) { const m = tk.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u); return m ? [m[1], m[2], m[3]] : ['', tk, '']; }
const CK_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 10-10"/></svg>';
const NX_SVG = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const dInputs = () => [...$('#dWords').querySelectorAll('.dw')];
function dictSummary() {
  let tot = 0, n = 0;
  dst.forEach((v) => { if (v.done) { tot += v.pct; n++; } });
  return 'dictation · ' + (dpos + 1) + '/' + ditems.length + (n ? ' · skor ' + Math.round(tot / n) + '%' : '');
}
function setDMsg(t, cls) { const m = $('#dMsg'); m.textContent = t; m.className = 'dmsg' + (cls ? ' ' + cls : ''); }
function dButton() {
  const st = dst.get(ditems[dpos]);
  const last = dpos >= ditems.length - 1;
  let label = 'Check', ico = CK_SVG;
  if (dFin) { label = 'Ulangi'; ico = NX_SVG; }
  else if (st && st.done) { label = last ? 'Selesai' : 'Next'; ico = NX_SVG; }
  $('#dGo').innerHTML = ico + '<span>' + label + '</span>';
}
function dUpdateNav() {
  const nav = $('#dNav');
  nav.innerHTML = ditems.map((idx, p) => {
    const s = dst.get(idx);
    const c = s && s.done ? (s.pct === 100 ? ' ok' : ' bad') : '';
    return '<button class="dn' + c + (p === dpos ? ' cur' : '') + '" data-p="' + p + '" aria-label="Kalimat ' + (p + 1) + '">' + (p + 1) + '</button>';
  }).join('');
  const cur = nav.children[dpos];
  if (cur) nav.scrollLeft = cur.offsetLeft - nav.clientWidth / 2 + cur.clientWidth / 2;
}
function dSaveVals() {
  const st = dst.get(ditems[dpos]);
  if (st && !st.done) st.vals = dInputs().map((x) => x.value);
}
function dMark() {
  const st = dst.get(ditems[dpos]);
  dInputs().forEach((x, k) => {
    const good = ansOf(x.value) === dwords[k].ans;
    x.classList.toggle('ok', good); x.classList.toggle('bad', !good);
    x.readOnly = true;
    const a = x.closest('.dtk').querySelector('.dans');
    if (!good) { a.textContent = dwords[k].core; a.hidden = false; }
  });
  setDMsg(st.correct + '/' + st.total + ' kata benar · ' + st.pct + '%' + (st.hints ? ' · ' + st.hints + ' petunjuk' : ''), st.pct === 100 ? 'good' : st.pct >= 60 ? 'mid' : 'low');
}
function dRender() {
  dFin = false;
  const i = ditems[dpos], d = DATA[i];
  let st = dst.get(i);
  if (!st) { st = { vals: [], done: false, correct: 0, total: 0, pct: 0, hints: 0 }; dst.set(i, st); }
  const toks = d.w ? d.w.map((x) => x[0]) : d.en.split(' ');
  dwords = [];
  let html = '';
  toks.forEach((tk) => {
    const ans = ansOf(tk);
    if (!ans) { html += '<span class="dtk"><span class="dpt">' + esc(tk) + '</span></span>'; return; }
    const [pre, core, post] = splitTok(tk);
    dwords.push({ ans, core });
    html += '<span class="dtk"><span class="row">' + (pre ? '<span class="dpt">' + esc(pre) + '</span>' : '') +
      '<input class="dw" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Kata ' + dwords.length + '" style="width:calc(' + Math.max(3, ans.length) + 'ch + 30px)">' +
      (post ? '<span class="dpt">' + esc(post) + '</span>' : '') + '</span><span class="dans" hidden></span></span>';
  });
  $('#dWords').innerHTML = html;
  dInputs().forEach((x, k) => { x.value = st.vals[k] || ''; });
  dUpdateNav(); dButton();
  if (st.done) {
    dMark();
    if (loopIdx != null && loopIdx !== drillIdx) setLoop(null);
    pause();
  } else {
    setDMsg('', '');
    setLoop(i, 0); seek(d.s); setActive(i, true); play();
    const first = dInputs()[0];
    if (first) first.focus({ preventScroll: true });
  }
  refreshStatus();
}
function dGo() {
  if (dFin) { dst.clear(); dpos = 0; dRender(); return; }
  const i = ditems[dpos], st = dst.get(i);
  if (st.done) {
    if (dpos < ditems.length - 1) { dpos++; dRender(); return; }
    dFin = true;
    let tot = 0, n = 0;
    dst.forEach((v) => { if (v.done) { tot += v.pct; n++; } });
    const avg = Math.round(n ? tot / n : 0);
    setDMsg('Selesai · skor rata-rata ' + avg + '% · ' + n + ' kalimat', avg === 100 ? 'good' : avg >= 60 ? 'mid' : 'low');
    dButton(); refreshStatus();
    return;
  }
  const inputs = dInputs();
  if (!inputs.some((x) => x.value.trim())) { setDMsg('Ketik dulu apa yang kamu dengar.', ''); if (inputs[0]) inputs[0].focus(); return; }
  st.vals = inputs.map((x) => x.value);
  let ok = 0;
  inputs.forEach((x, k) => { if (ansOf(x.value) === dwords[k].ans) ok++; });
  st.done = true; st.correct = ok; st.total = inputs.length; st.pct = Math.round((100 * ok) / Math.max(1, inputs.length));
  if (loopIdx === i) setLoop(null);
  pause();
  dMark(); dUpdateNav(); dButton(); refreshStatus();
}
function dHint() {
  const i = ditems[dpos], st = dst.get(i);
  if (!st || st.done) return;
  const inputs = dInputs();
  const k = inputs.findIndex((x, n) => ansOf(x.value) !== dwords[n].ans);
  if (k < 0) return;
  const v = ansOf(inputs[k].value), a = dwords[k].ans;
  let p = 0;
  while (p < v.length && v[p] === a[p]) p++;
  inputs[k].value = a.slice(0, p + 1);
  inputs[k].focus();
  st.hints++;
}
function setDict(on) {
  if (on) {
    if (sh.on) shStop();
    ditems = [];
    DATA.forEach((d, i) => { if (!d.m && (!pinOnly() || pins.has(d.t))) ditems.push(i); });
    if (!ditems.length) { flashStatus('tidak ada baris untuk dictation'); return; }
    const cur = Math.max(activeIdx, 0);
    const p = ditems.findIndex((i) => i >= cur);
    dpos = p < 0 ? 0 : p;
  }
  app.classList.toggle('dictation', on);
  $('#dict').hidden = !on;
  $('#bDict').setAttribute('aria-pressed', String(on));
  if (on) { setLoop(null); dRender(); }
  else {
    if (loopIdx != null && loopIdx !== drillIdx) setLoop(null);
    setTimeout(() => { if (activeIdx >= 0) scrollToLine(activeIdx, true); }, 80);
  }
  refreshStatus();
}
$('#bDict').addEventListener('click', () => { closeTip(); setDict(!dictOn()); });
$('#dGo').addEventListener('click', dGo);
$('#dHint').addEventListener('click', dHint);
$('#dAgain').addEventListener('click', () => {
  const i = ditems[dpos];
  setLoop(i, 0); seek(DATA[i].s); setActive(i, true); play();
});
$('#dNav').addEventListener('click', (e) => {
  const b = e.target.closest('.dn');
  if (!b) return;
  dSaveVals();
  dpos = +b.dataset.p;
  dRender();
});
$('#dWords').addEventListener('keydown', (e) => {
  const x = e.target;
  if (!x.classList.contains('dw')) return;
  const all = dInputs(), k = all.indexOf(x);
  if (e.key === 'Enter') { e.preventDefault(); if (k < all.length - 1 && !x.readOnly) all[k + 1].focus(); else dGo(); }
  else if (e.key === ' ') { e.preventDefault(); if (k < all.length - 1) all[k + 1].focus(); }
  else if (e.key === 'Backspace' && !x.value && k > 0) { e.preventDefault(); all[k - 1].focus(); }
});
$('#dWords').addEventListener('input', (e) => {
  const x = e.target;
  if (!x.classList.contains('dw') || !/\s/.test(x.value)) return;
  x.value = x.value.replace(/\s+/g, '');
  const all = dInputs(), k = all.indexOf(x);
  if (k < all.length - 1) all[k + 1].focus();
});
